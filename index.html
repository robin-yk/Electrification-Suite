<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive microwave heating, Joule heating, and RPH vs CJH dimensionless models for chemical process electrification by Yeonsu Kwak.">
  <title>Electrified Reactor Models | Yeonsu Kwak</title>
  <style>
    :root {
      --navy: #102a43;
      --navy-2: #173b5c;
      --ink: #172733;
      --muted: #63717c;
      --paper: #ffffff;
      --cream: #f5f2ec;
      --line: #d5dde3;
      --red: #bd3d3a;
      --blue: #00539f;
      --gold: #ffd200;
      --shadow: 0 22px 55px rgba(16, 42, 67, 0.12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: var(--cream);
      font-family: Arial, Helvetica, sans-serif;
    }
    button { font: inherit; }

    .suite {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    body.project-open {
      height: 100dvh;
      overflow: hidden;
    }
    body.project-open .suite {
      height: 100dvh;
      min-height: 0;
    }

    .suite-header {
      position: relative;
      z-index: 20;
      background: var(--navy);
      color: #fff;
      border-bottom: 4px solid var(--gold);
    }
    .suite-header-inner {
      width: min(1480px, 100%);
      min-height: 74px;
      margin: 0 auto;
      padding: 12px 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }
    .brand {
      min-width: 0;
      color: inherit;
      text-decoration: none;
      display: grid;
      gap: 3px;
    }
    .brand-name {
      color: #bcd0df;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
    .brand-title {
      overflow: hidden;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .suite-nav {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .nav-button {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      padding: 8px 12px;
      background: transparent;
      color: #dce7ee;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }
    .nav-button:hover,
    .nav-button:focus-visible {
      border-color: rgba(255, 255, 255, 0.62);
      color: #fff;
      outline: none;
    }
    .nav-button.active {
      border-color: #fff;
      background: #fff;
      color: var(--navy);
    }
    .nav-button-short { display: none; }

    .home {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: clamp(54px, 8vw, 105px) 24px 56px;
    }
    .home::before {
      position: absolute;
      z-index: -2;
      inset: 0;
      content: "";
      background:
        linear-gradient(rgba(16, 42, 67, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 42, 67, 0.035) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, #000 0%, transparent 78%);
    }
    .home::after {
      position: absolute;
      z-index: -1;
      top: -260px;
      left: 50%;
      width: 760px;
      height: 560px;
      border-radius: 50%;
      content: "";
      background: radial-gradient(circle, rgba(52, 122, 161, 0.14), rgba(189, 61, 58, 0.04) 50%, transparent 70%);
      transform: translateX(-50%);
    }
    .home-inner {
      width: min(1120px, 100%);
      margin: 0 auto;
    }
    .home-eyebrow {
      margin: 0 0 13px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .home h1 {
      max-width: 820px;
      margin: 0 0 34px;
      color: var(--navy);
      font-size: clamp(36px, 4.8vw, 56px);
      line-height: 1.02;
      letter-spacing: -0.047em;
    }
    .home-lede {
      max-width: 790px;
      margin: 22px 0 42px;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.55;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }
    .project-card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 330px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 27px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: var(--shadow);
      text-align: left;
      cursor: pointer;
      transition: transform 170ms ease, border-color 170ms ease, box-shadow 170ms ease;
    }
    .project-card::before {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 5px;
      content: "";
      background: var(--project-accent);
    }
    .project-card:hover,
    .project-card:focus-visible {
      border-color: var(--project-accent);
      box-shadow: 0 27px 65px rgba(16, 42, 67, 0.17);
      outline: none;
      transform: translateY(-4px);
    }
    .project-card.microwave { --project-accent: var(--blue); }
    .project-card.joule { --project-accent: var(--gold); }
    .project-card.rphcjh { --project-accent: var(--red); }
    .project-card .project-number { display: inline-block; color: #fff; background: var(--project-accent); border-radius: 999px; padding: 5px 8px; }
    .project-card.joule .project-number { color: var(--navy); }
    .project-number {
      display: block;
      margin-bottom: 34px;
      color: var(--project-accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .project-card h2 {
      max-width: 380px;
      margin: 0 0 9px;
      color: var(--navy);
      font-size: clamp(25px, 3vw, 35px);
      line-height: 1.07;
      letter-spacing: -0.035em;
    }
    .project-summary {
      max-width: 420px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .project-meta {
      margin-top: auto;
      padding-top: 22px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .project-tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 8px;
      color: #52636f;
      background: #f8fafb;
      font-size: 11px;
      font-weight: 700;
    }
    .open-label {
      flex: none;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }
    .open-label span {
      display: inline-block;
      margin-left: 5px;
      transition: transform 170ms ease;
    }
    .project-card:hover .open-label span { transform: translateX(4px); }

    .home-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px 20px;
      margin-top: 29px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: #74818a;
      font-size: 12px;
    }
    .footer-identity {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px 16px;
    }
    .footer-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .footer-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--navy);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      background: #fff;
      transition: border-color 150ms ease, background 150ms ease;
    }
    .footer-link:hover, .footer-link:focus-visible {
      border-color: var(--project-accent, var(--blue));
      background: var(--cream);
    }
    .footer-link svg { flex: none; }
    .footer-link.cv { --project-accent: var(--gold); }
    .footer-link.linkedin { --project-accent: var(--blue); color: #00539f; }
    .footer-link.email { --project-accent: var(--red); color: #bd3d3a; }

    .project-stage {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: var(--cream);
    }
    .project-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: var(--cream);
    }
    [hidden] { display: none !important; }

    @media (max-width: 980px) {
      .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .suite-header-inner {
        align-items: flex-start;
        padding: 11px 15px;
      }
      .brand-title { font-size: 14px; }
      .brand-name { font-size: 10px; }
      .suite-nav { gap: 4px; }
      .nav-button { padding: 7px 9px; }
      .nav-button-label { display: none; }
      .nav-button-short { display: inline; }
      .home { padding: 47px 15px 38px; }
      .project-grid { grid-template-columns: 1fr; }
      .project-card { min-height: 310px; padding: 23px; }
      .home-footer { display: grid; }
    }
    @media (max-width: 460px) {
      .brand-title { max-width: 205px; }
      .home h1 { font-size: 34px; }
      .project-meta { align-items: flex-start; flex-direction: column; gap: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
      .project-card,
      .open-label span { transition: none; }
    }
  </style>
</head>
<body>
  <div class="suite">
    <header class="suite-header">
      <div class="suite-header-inner">
        <a class="brand" href="#home" data-route="home" aria-label="Project home">
          <span class="brand-name">Yeonsu Kwak</span>
          <span class="brand-title">Electrified Reactor Models</span>
        </a>
        <nav class="suite-nav" aria-label="Project navigation">
          <button class="nav-button active" type="button" data-route="home">Home</button>
          <button class="nav-button" type="button" data-route="microwave"><span class="nav-button-label">Microwave</span><span class="nav-button-short" aria-hidden="true">MW</span></button>
          <button class="nav-button" type="button" data-route="joule"><span class="nav-button-label">Joule</span><span class="nav-button-short" aria-hidden="true">JH</span></button>
          <button class="nav-button" type="button" data-route="rphcjh"><span class="nav-button-label">RPH vs CJH</span><span class="nav-button-short" aria-hidden="true">RC</span></button>
        </nav>
      </div>
    </header>

    <main id="home" class="home">
      <div class="home-inner">
        <p class="home-eyebrow">Interactive modeling portfolio</p>
        <h1>Electrified Reactor Models</h1>

        <div class="project-grid" aria-label="Select a project">
          <button class="project-card microwave" type="button" data-route="microwave">
            <span class="project-number">Project 01 · Microwave</span>
            <h2>Microwave Heating 2D Model</h2>
            <p class="project-summary">Steady-state powder-bed temperature fields with dielectric response, penetration depth, heat transfer, and experimental calibration.</p>
            <span class="project-meta">
              <span class="project-tags" aria-label="Microwave model topics">
                <span class="project-tag">Material profile</span>
                <span class="project-tag">2D thermal field</span>
                <span class="project-tag">Calibration</span>
              </span>
              <span class="open-label">Open model <span aria-hidden="true">→</span></span>
            </span>
          </button>

          <button class="project-card joule" type="button" data-route="joule">
            <span class="project-number">Project 02 · Joule</span>
            <h2>Joule Heating 2D Optimizer</h2>
            <p class="project-summary">Electrical and thermal screening across materials, geometry, hardware limits, heat losses, and an axisymmetric temperature field.</p>
            <span class="project-meta">
              <span class="project-tags" aria-label="Joule model topics">
                <span class="project-tag">Material compare</span>
                <span class="project-tag">Power limits</span>
                <span class="project-tag">2D optimization</span>
              </span>
              <span class="open-label">Open optimizer <span aria-hidden="true">→</span></span>
            </span>
          </button>

          <button class="project-card rphcjh" type="button" data-route="rphcjh">
            <span class="project-number">Project 03 · RPH vs CJH</span>
            <h2>RPH vs CJH Dimensionless Visualizer</h2>
            <p class="project-summary">Jensen's-inequality effects of ramped vs. continuous heating on temperature-dependent kinetics and transport, and the resulting exposure and Damköhler ratios for ethane cracking.</p>
            <span class="project-meta">
              <span class="project-tags" aria-label="RPH vs CJH model topics">
                <span class="project-tag">Jensen's inequality</span>
                <span class="project-tag">Λ / Damköhler ratios</span>
                <span class="project-tag">Ethane cracking</span>
              </span>
              <span class="open-label">Open visualizer <span aria-hidden="true">→</span></span>
            </span>
          </button>
        </div>

        <footer class="home-footer">
          <div class="footer-identity">
            <span>Yeonsu Kwak | Vlachos Lab, University of Delaware</span>
            <div class="footer-links">
              <a class="footer-link cv" href="Yeonsu-Kwak-CV.pdf" target="_blank" rel="noopener" aria-label="Download CV (PDF)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>
                <span>CV</span>
              </a>
              <a class="footer-link linkedin" href="https://www.linkedin.com/in/yeonsukwak/" target="_blank" rel="noopener" aria-label="LinkedIn profile">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.34V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM7.12 20.45H3.56V9h3.56v11.45zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13z"/></svg>
                <span>LinkedIn</span>
              </a>
              <a class="footer-link email" href="mailto:ask.yeonsu@gmail.com" aria-label="Email ask.yeonsu@gmail.com">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="m3 6.5 9 6.5 9-6.5"/></svg>
                <span>Email</span>
              </a>
            </div>
          </div>
          <span>Tested solver modules · calculations run locally in the browser, nothing uploaded</span>
        </footer>
      </div>
    </main>

    <section id="project-stage" class="project-stage" aria-live="polite" hidden>
      <iframe id="project-frame" class="project-frame" title="Selected electrification project"></iframe>
    </section>
  </div>

  <script>
    (function () {
      "use strict";

      const routeTitles = {
        microwave: "Microwave Heating 2D Model",
        joule: "Joule Heating 2D Optimizer",
        rphcjh: "RPH vs CJH Dimensionless Visualizer"
      };

      const home = document.getElementById("home");
      const stage = document.getElementById("project-stage");
      const frame = document.getElementById("project-frame");
      const routeControls = Array.from(document.querySelectorAll("[data-route]"));
      let loadedRoute = null;

      function setActiveControl(route) {
        routeControls.forEach(function (control) {
          const active = control.dataset.route === route;
          control.classList.toggle("active", active);
          if (control.tagName === "BUTTON") control.setAttribute("aria-pressed", String(active));
        });
      }

      function showRoute(route, updateHash) {
        if (!routeTitles[route]) route = "home";
        const isHome = route === "home";
        document.body.classList.toggle("project-open", !isHome);
        home.hidden = !isHome;
        stage.hidden = isHome;
        setActiveControl(route);

        if (isHome) {
          document.title = "Electrified Reactor Models | Yeonsu Kwak";
          frame.removeAttribute("src");
          loadedRoute = null;
        } else {
          document.title = routeTitles[route] + " | Yeonsu Kwak";
          frame.title = routeTitles[route];
          if (loadedRoute !== route) {
            frame.src = route + ".html";
            loadedRoute = route;
          }
        }

        if (updateHash) history.pushState({ route: route }, "", "#" + route);
      }

      routeControls.forEach(function (control) {
        control.addEventListener("click", function (event) {
          event.preventDefault();
          showRoute(control.dataset.route, true);
        });
      });

      window.addEventListener("popstate", function () {
        showRoute(location.hash.slice(1) || "home", false);
      });
      window.addEventListener("hashchange", function () {
        showRoute(location.hash.slice(1) || "home", false);
      });

      showRoute(location.hash.slice(1) || "home", false);
    }());
  </script>
</body>
</html>
