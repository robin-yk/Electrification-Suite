<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="300pt" viewBox="0 0 505 300" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="300" fill="#FFFFFF"/><defs><marker id="rs1-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="rs1-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="rs1-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="rs1-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="rs1-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="rs1-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="rs1-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="rs1-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker><marker id="rs1-hair" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#AEB6BD"/></marker><marker id="rs1-edge" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C9CFD5"/></marker></defs><text x="22" y="22" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">CHECK, AND WHAT IT IS CHECKED AGAINST</text><text x="372" y="22" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="bold">CASES</text><text x="488" y="22" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="bold">WORST RESIDUAL</text><path d="M22,27 L488,27" fill="none" stroke="#111111" stroke-width="0.9"/><text x="22" y="44" font-size="8" fill="#4A5058" text-anchor="start" font-weight="bold">INTEGRATED WITH A FINITE STEP</text><text x="488" y="44" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">limited by the step</text><path d="M22,49 L488,49" fill="none" stroke="#BBBBBB" stroke-width="0.6"/><text x="30" y="62" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">Full duty recovers the steady drive</text><text x="372" y="62" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">4</text><text x="488" y="62" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">4.0 × 10<tspan font-size="8" dy="-3.1">−4</tspan><tspan dy="3.1">​</tspan> K</text><text x="30" y="72" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">steady voltage-drive solve, 20 to 60 V</text><text x="30" y="88" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">Energy closes over one cycle</text><text x="372" y="88" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">5</text><text x="488" y="88" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">5.8 × 10<tspan font-size="8" dy="-3.1">−4</tspan><tspan dy="3.1">​</tspan> relative</text><text x="30" y="98" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">electrical in against losses out</text><text x="22" y="120" font-size="8" fill="#4A5058" text-anchor="start" font-weight="bold">EXACT BY CONSTRUCTION</text><text x="488" y="120" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">limited by the arithmetic</text><path d="M22,125 L488,125" fill="none" stroke="#BBBBBB" stroke-width="0.6"/><text x="30" y="138" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">Constant temperature recovers the analytic CSTR</text><text x="372" y="138" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">3</text><text x="488" y="138" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">2.9 × 10<tspan font-size="8" dy="-3.1">−14</tspan><tspan dy="3.1">​</tspan> mole fraction</text><text x="30" y="148" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">closed-form steady state, 900 to 1300 °C</text><text x="30" y="164" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">The conversion inversion round trips</text><text x="372" y="164" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">4</text><text x="488" y="164" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">5.6 × 10<tspan font-size="8" dy="-3.1">−16</tspan><tspan dy="3.1">​</tspan> conversion</text><text x="30" y="174" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">its own steady conversion, X 0.01 to 0.9</text><text x="22" y="196" font-size="8" fill="#4A5058" text-anchor="start" font-weight="bold">PERIODIC UNDER STRESS</text><text x="488" y="196" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">the fixed point returns to itself however fast the hot step runs</text><path d="M22,201 L488,201" fill="none" stroke="#BBBBBB" stroke-width="0.6"/><text x="30" y="214" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">The 80 and 120 V drives are numerical tests. Their peaks are far outside the material-property range and are not operating points.</text><text x="30" y="227" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">40 V drive, peak 986 °C</text><text x="372" y="227" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">1</text><text x="488" y="227" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">3.3 × 10<tspan font-size="8" dy="-3.1">−16</tspan><tspan dy="3.1">​</tspan> drift over a cycle</text><text x="30" y="237" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">k₁ at the peak reaches 1.2 × 10<tspan font-size="8" dy="-3.1">0</tspan><tspan dy="3.1">​</tspan> s⁻¹, and x<tspan font-size="8" dy="1.9">B</tspan><tspan dy="-1.9">​</tspan> stays inside [0, 1]</text><text x="30" y="253" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">80 V drive, peak 2287 °C</text><text x="372" y="253" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">1</text><text x="488" y="253" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">1.9 × 10<tspan font-size="8" dy="-3.1">−16</tspan><tspan dy="3.1">​</tspan> drift over a cycle</text><text x="30" y="263" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">k₁ at the peak reaches 3.4 × 10<tspan font-size="8" dy="-3.1">8</tspan><tspan dy="3.1">​</tspan> s⁻¹, and x<tspan font-size="8" dy="1.9">B</tspan><tspan dy="-1.9">​</tspan> stays inside [0, 1]</text><text x="30" y="279" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">120 V drive, peak 4620 °C</text><text x="372" y="279" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">1</text><text x="488" y="279" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">5.6 × 10<tspan font-size="8" dy="-3.1">−17</tspan><tspan dy="3.1">​</tspan> drift over a cycle</text><text x="30" y="289" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">k₁ at the peak reaches 2.6 × 10<tspan font-size="8" dy="-3.1">12</tspan><tspan dy="3.1">​</tspan> s⁻¹, and x<tspan font-size="8" dy="1.9">B</tspan><tspan dy="-1.9">​</tspan> stays inside [0, 1]</text></svg>