<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="320pt" viewBox="0 0 505 320" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="320" fill="#FFFFFF"/><defs><marker id="rs4-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="rs4-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="rs4-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="rs4-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="rs4-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="rs4-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="rs4-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="rs4-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker><marker id="rs4-hair" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#AEB6BD"/></marker><marker id="rs4-edge" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C9CFD5"/></marker></defs><text x="18" y="22" font-size="11" fill="#111111" text-anchor="start" font-weight="bold">a</text><text x="34" y="22" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">WHAT THE FITTED KERNEL USES</text><text x="487" y="22" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">shorter bar, stronger dependence</text><text x="142" y="43" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">logit X<tspan font-size="8" dy="1.9">qs</tspan><tspan dy="-1.9">​</tspan>, the baseline itself</text><rect x="150" y="34" width="61.2" height="11" fill="#D55E00" fill-opacity="0.85"/><text x="216.2375" y="43" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">2.13</text><text x="142" y="65" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">log₁₀(period / residence time)</text><rect x="150" y="56" width="62.4" height="11" fill="#D55E00" fill-opacity="0.85"/><text x="217.3875" y="65" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">2.17</text><text x="142" y="87" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">duty</text><rect x="150" y="78" width="215.3" height="11" fill="#6E6E6E" fill-opacity="0.35"/><text x="370.3375" y="87" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">7.49</text><text x="142" y="109" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">element peak temperature</text><rect x="150" y="100" width="55.2" height="11" fill="#D55E00" fill-opacity="0.85"/><text x="210.2" y="109" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">1.92</text><text x="142" y="131" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">element minimum temperature</text><rect x="150" y="122" width="114.1" height="11" fill="#6E6E6E" fill-opacity="0.35"/><text x="269.1375" y="131" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">3.97</text><path d="M150,144 L380,144" fill="none" stroke="#6E6E6E" stroke-width="0.8"/><text x="150" y="155" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">0</text><text x="207.5" y="155" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">2</text><text x="265" y="155" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">4</text><text x="322.5" y="155" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">6</text><text x="380" y="155" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">8</text><text x="265" y="167" font-size="8.5" fill="#111111" text-anchor="middle" font-weight="normal">length scale, in standard deviations of the input</text><text x="18" y="182" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">Duty is the one input the correction barely reads. That is not a defect: the element ODE has already</text><text x="18" y="192" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">spent duty producing the peak and minimum temperatures, which the model does read.</text><text x="18" y="210" font-size="11" fill="#111111" text-anchor="start" font-weight="bold">b</text><text x="34" y="210" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">MEASURED ON THE DEVELOPMENT TEST CASES</text><text x="300" y="224" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="bold">MEAN</text><text x="372" y="224" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="bold">P95</text><text x="448" y="224" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="bold">MAX</text><path d="M22,229 L488,229" fill="none" stroke="#111111" stroke-width="0.9"/><text x="22" y="243" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">A CJH as-is</text><text x="300" y="243" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">0.0342</text><text x="372" y="243" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">0.2350</text><text x="448" y="243" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">0.3640</text><text x="22" y="258" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">B IDW(k=8)</text><text x="300" y="258" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">0.0151</text><text x="372" y="258" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">0.0753</text><text x="448" y="258" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">0.2010</text><text x="22" y="273" font-size="8.5" fill="#A84A00" text-anchor="start" font-weight="bold">C GP</text><text x="300" y="273" font-size="8.5" fill="#A84A00" text-anchor="end" font-weight="bold">0.0027</text><text x="372" y="273" font-size="8.5" fill="#A84A00" text-anchor="end" font-weight="bold">0.0116</text><text x="448" y="273" font-size="8.5" fill="#A84A00" text-anchor="end" font-weight="bold">0.0276</text><path d="M22,278 L488,278" fill="none" stroke="#BBBBBB" stroke-width="0.6"/><text x="22" y="290" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">Development criteria, all fixed before the model was fitted:</text><text x="22" y="302" font-size="8" fill="#00785A" text-anchor="start" font-weight="bold">pass  mean ≤ 0.02</text><text x="182" y="302" font-size="8" fill="#00785A" text-anchor="start" font-weight="bold">pass  p95 ≤ 0.05</text><text x="342" y="302" font-size="8" fill="#00785A" text-anchor="start" font-weight="bold">pass  max ≤ 0.10</text><text x="22" y="313" font-size="8" fill="#00785A" text-anchor="start" font-weight="bold">pass  ≥ 30% better than A</text><text x="182" y="313" font-size="8" fill="#00785A" text-anchor="start" font-weight="bold">pass  long-period correction small</text></svg>