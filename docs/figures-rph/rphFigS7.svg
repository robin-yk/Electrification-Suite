<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="240pt" viewBox="0 0 505 240" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="240" fill="#FFFFFF"/><defs><marker id="rs2-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="rs2-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="rs2-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="rs2-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="rs2-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="rs2-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="rs2-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="rs2-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker><marker id="rs2-hair" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#AEB6BD"/></marker><marker id="rs2-edge" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C9CFD5"/></marker></defs><rect x="70" y="44" width="228" height="100" rx="4" fill="#DBF1EB" stroke="#009E73" stroke-width="1"/><text x="80" y="60" font-size="8" fill="#00785A" text-anchor="start" font-weight="bold">IDEAL CSTR, CONSTANT PRESSURE</text><text x="80" y="72" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">A → B → C, first order in both steps</text><rect x="96" y="102" width="176" height="26" rx="2" fill="#F9E9DB" stroke="#D55E00" stroke-width="1"/><text x="184" y="113" font-size="8" fill="#A84A00" text-anchor="middle" font-weight="bold">ELEMENT, ONE TEMPERATURE</text><text x="184" y="123" font-size="8" fill="#111111" text-anchor="middle" font-weight="normal">m c<tspan font-size="8" dy="1.9">p</tspan><tspan dy="-1.9">​</tspan>(T) dT/dt = V²/R(T) − losses(T)</text><path d="M144,99 L144,80" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#rs2-thermal)"/><text x="150" y="90" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">T(t)</text><path d="M214,80 L214,99" fill="none" stroke="#AEB6BD" stroke-width="0.9" stroke-dasharray="2 2"/><path d="M209,84 L219,94" fill="none" stroke="#6E6E6E" stroke-width="1"/><path d="M219,84 L209,94" fill="none" stroke="#6E6E6E" stroke-width="1"/><text x="224" y="86" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">no heat</text><text x="224" y="96" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">feedback</text><path d="M30,94 L66,94" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#rs2-hair)"/><text x="22" y="80" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">1:1 CH₄/CO₂</text><text x="22" y="90" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">at 1 atm</text><path d="M302,94 L332,94" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#rs2-hair)"/><text x="306" y="88" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">τ fixed</text><rect x="70" y="164" width="228" height="34" rx="2" fill="#EDEFF1" stroke="#AEB6BD" stroke-width="0.8" stroke-dasharray="3 2"/><text x="80" y="178" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">OFFLINE, FOR COMPARISON ONLY</text><text x="80" y="190" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">steady 1-D plug flow, gas phase only</text><text x="348" y="22" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">NOT RESOLVED</text><path d="M348,27 L488,27" fill="none" stroke="#111111" stroke-width="0.9"/><rect x="348" y="36" width="3" height="26" fill="#D55E00"/><text x="357" y="44" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">Gradients inside the element,</text><text x="357" y="54" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">or any element that is not thin</text><rect x="348" y="72" width="3" height="26" fill="#009E73"/><text x="357" y="80" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">Absolute yields: the network</text><text x="357" y="90" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">isolates averaging, not mechanism</text><rect x="348" y="108" width="3" height="26" fill="#0072B2"/><text x="357" y="116" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">Conversion feeding back on</text><text x="357" y="126" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">temperature, and thermal runaway</text><rect x="348" y="144" width="3" height="26" fill="#6E6E6E"/><text x="357" y="152" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">Surface chemistry, and any</text><text x="357" y="162" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">transient the plug flow cannot blend</text><path d="M22,210 L488,210" fill="none" stroke="#BBBBBB" stroke-width="0.6"/><text x="22" y="223" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">No layer carries oxidation, sublimation or a lifetime model, so a temperature the element reaches here is not one it survives.</text></svg>