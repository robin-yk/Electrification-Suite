<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="406pt" viewBox="0 0 505 406" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="406" fill="#FFFFFF"/><defs><marker id="rs2-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="rs2-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="rs2-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="rs2-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="rs2-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="rs2-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="rs2-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="rs2-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker><marker id="rs2-hair" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#AEB6BD"/></marker><marker id="rs2-edge" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C9CFD5"/></marker></defs><text x="22" y="22" font-size="11" fill="#111111" text-anchor="start" font-weight="bold">a</text><text x="38" y="22" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">THE MODELLED ARRANGEMENT</text><rect x="70" y="44" width="228" height="100" rx="4" fill="#DBF1EB" stroke="#009E73" stroke-width="1"/><text x="80" y="60" font-size="8" fill="#00785A" text-anchor="start" font-weight="bold">IDEAL CSTR, CONSTANT PRESSURE</text><text x="80" y="72" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">A → B → C, first order in both steps</text><rect x="96" y="102" width="176" height="26" rx="2" fill="#F9E9DB" stroke="#D55E00" stroke-width="1"/><text x="184" y="113" font-size="8" fill="#A84A00" text-anchor="middle" font-weight="bold">ELEMENT, ONE TEMPERATURE</text><text x="184" y="123" font-size="8" fill="#111111" text-anchor="middle" font-weight="normal">m c<tspan font-size="8" dy="1.9">p</tspan><tspan dy="-1.9">​</tspan>(T) dT/dt = V²/R(T) − losses(T)</text><path d="M144,99 L144,80" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#rs2-thermal)"/><text x="150" y="90" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">T(t)</text><path d="M214,80 L214,99" fill="none" stroke="#AEB6BD" stroke-width="0.9" stroke-dasharray="2 2"/><path d="M209,84 L219,94" fill="none" stroke="#6E6E6E" stroke-width="1"/><path d="M219,84 L209,94" fill="none" stroke="#6E6E6E" stroke-width="1"/><text x="224" y="86" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">no heat</text><text x="224" y="96" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">feedback</text><path d="M30,94 L66,94" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#rs2-hair)"/><text x="22" y="80" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">1:1 CH₄/CO₂</text><text x="22" y="90" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">at 1 atm</text><path d="M302,94 L332,94" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#rs2-hair)"/><text x="306" y="88" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">τ fixed</text><rect x="70" y="164" width="228" height="34" rx="2" fill="#EDEFF1" stroke="#AEB6BD" stroke-width="0.8" stroke-dasharray="3 2"/><text x="80" y="178" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">OFFLINE, FOR COMPARISON ONLY</text><text x="80" y="190" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">steady 1-D plug flow, gas phase only</text><text x="348" y="22" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">NOT RESOLVED</text><path d="M348,27 L488,27" fill="none" stroke="#111111" stroke-width="0.9"/><rect x="348" y="36" width="3" height="26" fill="#D55E00"/><text x="357" y="44" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">Gradients inside the element,</text><text x="357" y="54" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">or any element that is not thin</text><rect x="348" y="72" width="3" height="26" fill="#009E73"/><text x="357" y="80" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">Absolute yields: the network</text><text x="357" y="90" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">isolates averaging, not mechanism</text><rect x="348" y="108" width="3" height="26" fill="#0072B2"/><text x="357" y="116" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">Conversion feeding back on</text><text x="357" y="126" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">temperature, and thermal runaway</text><rect x="348" y="144" width="3" height="26" fill="#6E6E6E"/><text x="357" y="152" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">Surface chemistry, and any</text><text x="357" y="162" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">transient the plug flow cannot blend</text><path d="M22,214 L488,214" fill="none" stroke="#BBBBBB" stroke-width="0.6"/><text x="22" y="242" font-size="11" fill="#111111" text-anchor="start" font-weight="bold">b</text><text x="38" y="242" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">WHAT THE OMITTED LAG COSTS</text><text x="488" y="242" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">a gas that does not follow the element sees a smaller S</text><rect x="70" y="264" width="300" height="92" rx="0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.8"/><path d="M70,356 L370,356" fill="none" stroke="#EAEAEA" stroke-width="0.4"/><text x="66" y="359" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">0</text><path d="M70,331.42857142857144 L370,331.42857142857144" fill="none" stroke="#EAEAEA" stroke-width="0.4"/><text x="66" y="334.42857142857144" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">2</text><path d="M70,306.8571428571429 L370,306.8571428571429" fill="none" stroke="#EAEAEA" stroke-width="0.4"/><text x="66" y="309.8571428571429" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">4</text><path d="M70,282.2857142857143 L370,282.2857142857143" fill="none" stroke="#EAEAEA" stroke-width="0.4"/><text x="66" y="285.2857142857143" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">6</text><path d="M70,343.7142857142857 L370,343.7142857142857" fill="none" stroke="#111111" stroke-width="0.8" stroke-dasharray="3 2"/><rect x="76" y="342.97714285714284" width="38" height="13.022857142857163" rx="0" fill="#F9E9DB" stroke="#D55E00" stroke-width="0.8"/><path d="M76,343.7142857142857 L114,343.7142857142857" fill="none" stroke="#A84A00" stroke-width="1.2"/><text x="95" y="338.97714285714284" font-size="8" fill="#A84A00" text-anchor="middle" font-weight="bold">1.06</text><text x="95" y="368" font-size="8" fill="#111111" text-anchor="middle" font-weight="normal">0–2</text><text x="95" y="378" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">n 96</text><rect x="126" y="340.52" width="38" height="15.480000000000018" rx="0" fill="#F9E9DB" stroke="#D55E00" stroke-width="0.8"/><path d="M126,343.5914285714286 L164,343.5914285714286" fill="none" stroke="#A84A00" stroke-width="1.2"/><text x="145" y="336.52" font-size="8" fill="#A84A00" text-anchor="middle" font-weight="bold">1.26</text><text x="145" y="368" font-size="8" fill="#111111" text-anchor="middle" font-weight="normal">2–5</text><text x="145" y="378" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">n 40</text><rect x="176" y="333.64" width="38" height="22.360000000000014" rx="0" fill="#F9E9DB" stroke="#D55E00" stroke-width="0.8"/><path d="M176,342.7314285714286 L214,342.7314285714286" fill="none" stroke="#A84A00" stroke-width="1.2"/><text x="195" y="329.64" font-size="8" fill="#A84A00" text-anchor="middle" font-weight="bold">1.82</text><text x="195" y="368" font-size="8" fill="#111111" text-anchor="middle" font-weight="normal">5–10</text><text x="195" y="378" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">n 25</text><rect x="226" y="308.2085714285714" width="38" height="47.79142857142858" rx="0" fill="#F9E9DB" stroke="#D55E00" stroke-width="0.8"/><path d="M226,338.43142857142857 L264,338.43142857142857" fill="none" stroke="#A84A00" stroke-width="1.2"/><text x="245" y="304.2085714285714" font-size="8" fill="#A84A00" text-anchor="middle" font-weight="bold">3.89</text><text x="245" y="368" font-size="8" fill="#111111" text-anchor="middle" font-weight="normal">10–20</text><text x="245" y="378" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">n 33</text><rect x="276" y="294.2028571428571" width="38" height="61.79714285714289" rx="0" fill="#F9E9DB" stroke="#D55E00" stroke-width="0.8"/><path d="M276,340.64285714285717 L314,340.64285714285717" fill="none" stroke="#A84A00" stroke-width="1.2"/><text x="295" y="290.2028571428571" font-size="8" fill="#A84A00" text-anchor="middle" font-weight="bold">5.03</text><text x="295" y="368" font-size="8" fill="#111111" text-anchor="middle" font-weight="normal">20–40</text><text x="295" y="378" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">n 30</text><rect x="326" y="282.6542857142857" width="38" height="73.34571428571428" rx="0" fill="#F9E9DB" stroke="#D55E00" stroke-width="0.8"/><path d="M326,338.43142857142857 L364,338.43142857142857" fill="none" stroke="#A84A00" stroke-width="1.2"/><text x="345" y="278.6542857142857" font-size="8" fill="#A84A00" text-anchor="middle" font-weight="bold">5.97</text><text x="345" y="368" font-size="8" fill="#111111" text-anchor="middle" font-weight="normal">≥ 40</text><text x="345" y="378" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">n 18</text><text x="220" y="391" font-size="8.5" fill="#111111" text-anchor="middle" font-weight="normal">Arrhenius swing number  S</text><g transform="rotate(-90 44 310)"><text x="44" y="310" font-size="8.5" fill="#111111" text-anchor="middle" font-weight="normal">X<tspan font-size="8" dy="1.9">dyn</tspan><tspan dy="-1.9">​</tspan> / X<tspan font-size="8" dy="1.9">qs</tspan><tspan dy="-1.9">​</tspan></text></g><rect x="384" y="268" width="16" height="10" rx="0" fill="#F9E9DB" stroke="#D55E00" stroke-width="0.8"/><text x="404" y="276" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">largest in bin</text><path d="M384,290 L400,290" fill="none" stroke="#A84A00" stroke-width="1.2"/><text x="404" y="293" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">median</text><text x="384" y="322" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">The largest departure</text><text x="384" y="332" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">rises with S, so the</text><text x="384" y="342" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">headline ratio is an</text><text x="384" y="352" font-size="8" fill="#A84A00" text-anchor="start" font-weight="bold">upper bound.</text><text x="22" y="396" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">No layer carries oxidation, sublimation or a lifetime model, so a temperature the element reaches here is not one it survives.</text></svg>