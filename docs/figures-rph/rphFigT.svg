<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="168pt" viewBox="0 0 505 168" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="168" fill="#FFFFFF"/><defs><marker id="rt2-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="rt2-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="rt2-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="rt2-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="rt2-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="rt2-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="rt2-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="rt2-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker><marker id="rt2-hair" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#AEB6BD"/></marker><marker id="rt2-edge" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C9CFD5"/></marker></defs><rect x="30" y="72" width="96" height="32" rx="5" fill="#FBFBFB" stroke="#6E6E6E" stroke-width="0.9"/><text x="78" y="86" font-size="9" fill="#111111" text-anchor="middle" font-weight="normal">operating</text><text x="78" y="97" font-size="9" fill="#111111" text-anchor="middle" font-weight="normal">conditions</text><path d="M130,80 C 200,40 300,40 376,74" fill="none" stroke="#D55E00" stroke-width="1.6" marker-end="url(#rt2-thermal)"/><text x="240" y="36" font-size="9.5" fill="#A84A00" text-anchor="middle" font-weight="bold">solve the full transient chemistry</text><text x="240" y="48" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">≈ 28 s per operating point</text><path d="M130,96 C 200,138 300,138 376,114" fill="none" stroke="#0072B2" stroke-width="1.6" marker-end="url(#rt2-scalar)"/><text x="240" y="152" font-size="9.5" fill="#005B8F" text-anchor="middle" font-weight="bold">look up a steady map, add a learned correction</text><text x="240" y="163" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">6 ms per point, in a browser · 2,473× faster</text><rect x="380" y="58" width="100" height="76" rx="6" fill="#DBF1EB" stroke="#00785A" stroke-width="1.1"/><text x="430" y="76" font-size="10" fill="#00785A" text-anchor="middle" font-weight="bold">the same</text><text x="430" y="89" font-size="10" fill="#00785A" text-anchor="middle" font-weight="bold">answer</text><text x="430" y="105" font-size="7.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">conversions and yields</text><text x="430" y="116" font-size="7.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">agree to 0.003–0.006</text><text x="430" y="127" font-size="7.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">on 195 unseen points</text></svg>