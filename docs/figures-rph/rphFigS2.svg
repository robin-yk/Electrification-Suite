<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="314pt" viewBox="0 0 505 314" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="314" fill="#FFFFFF"/><defs><marker id="rs2-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="rs2-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="rs2-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="rs2-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="rs2-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="rs2-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="rs2-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="rs2-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker><marker id="rs2-hair" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#AEB6BD"/></marker><marker id="rs2-edge" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C9CFD5"/></marker></defs><text x="22" y="22" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">LAYER</text><text x="126" y="22" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">WHAT IS SOLVED</text><path d="M22,27 L488,27" fill="none" stroke="#111111" stroke-width="0.9"/><rect x="22" y="37" width="4" height="46" fill="#D55E00"/><text x="32" y="44" font-size="9" fill="#A84A00" text-anchor="start" font-weight="bold">The element</text><text x="126" y="44" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">One temperature, integrated as m c<tspan font-size="8" dy="1.9">p</tspan><tspan dy="-1.9">​</tspan>(T) dT/dt = V²/R(T) − losses(T).</text><text x="126" y="57" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">why that is allowed:  Measured spatial uniformity and a 210 µm thickness make it thermally thin.</text><text x="126" y="70" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">so do not ask it:  Any question about gradients inside the element, or any element that is not thin.</text><path d="M22,93 L488,93" fill="none" stroke="#EAEAEA" stroke-width="0.5"/><rect x="22" y="99" width="4" height="46" fill="#009E73"/><text x="32" y="106" font-size="9" fill="#00785A" text-anchor="start" font-weight="bold">The reactor</text><text x="126" y="106" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">An ideal CSTR at the element's temperature, with A → B → C first order in both steps.</text><text x="126" y="119" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">why that is allowed:  The network is the smallest one that carries a selectivity to an intermediate.</text><text x="126" y="132" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">so do not ask it:  Absolute yields. It isolates the averaging effect; it does not predict a mechanism.</text><path d="M22,155 L488,155" fill="none" stroke="#EAEAEA" stroke-width="0.5"/><rect x="22" y="161" width="4" height="46" fill="#0072B2"/><text x="32" y="168" font-size="9" fill="#005B8F" text-anchor="start" font-weight="bold">The coupling</text><text x="126" y="168" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">Temperature drives chemistry, one way.</text><text x="126" y="181" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">why that is allowed:  Reaction heat is small against the electrical power at these conversions.</text><text x="126" y="194" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">so do not ask it:  Anything where conversion feeds back on temperature, or a runaway.</text><path d="M22,217 L488,217" fill="none" stroke="#EAEAEA" stroke-width="0.5"/><rect x="22" y="223" width="4" height="46" fill="#6E6E6E"/><text x="32" y="230" font-size="9" fill="#4A5058" text-anchor="start" font-weight="bold">The detailed check</text><text x="126" y="230" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">Steady one-dimensional plug flow, gas phase only, from committed offline runs.</text><text x="126" y="243" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">why that is allowed:  Hot-zone residence is milliseconds against pulse periods of order a second.</text><text x="126" y="256" font-size="8" fill="#A84A00" text-anchor="start" font-weight="normal">so do not ask it:  Surface chemistry, and any transient the plug-flow states cannot be blended into.</text><path d="M22,279 L488,279" fill="none" stroke="#111111" stroke-width="0.9"/><text x="22" y="292" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">No layer carries oxidation, sublimation or a lifetime model, so a temperature</text><text x="22" y="303" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">the element reaches here is not a temperature it survives.</text></svg>