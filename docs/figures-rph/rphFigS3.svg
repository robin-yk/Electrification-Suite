<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="330pt" viewBox="0 0 505 330" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="330" fill="#FFFFFF"/><defs><marker id="r9-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="r9-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="r9-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="r9-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="r9-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="r9-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="r9-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="r9-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker><marker id="r9-hair" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#AEB6BD"/></marker><marker id="r9-edge" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C9CFD5"/></marker></defs><text x="18" y="22" font-size="11" fill="#111111" text-anchor="start" font-weight="bold">a</text><text x="34" y="22" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">MAKING ONE TRAINING LABEL</text><text x="487" y="22" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">worked on the campaign's strongest memory case</text><rect x="18" y="32" width="108" height="46" rx="2" fill="#DBEBF4" stroke="#C9CFD5" stroke-width="0.8"/><text x="72" y="45" font-size="8.5" fill="#005B8F" text-anchor="middle" font-weight="bold">Drive</text><text x="72" y="57" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">42.2 V,  8.69 s</text><text x="72" y="67" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">2.0 % duty</text><path d="M126,55 L140,55" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#r9-hair)"/><rect x="141" y="32" width="112" height="46" rx="2" fill="#F9E9DB" stroke="#C9CFD5" stroke-width="0.8"/><text x="197" y="45" font-size="8.5" fill="#A84A00" text-anchor="middle" font-weight="bold">Element ODE</text><text x="197" y="57" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">peak 1662 °C</text><text x="197" y="67" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">minimum 137 °C</text><text x="203" y="86" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">T(t), integrated to a periodic state</text><path d="M197,78 L197,92 L84,92 L84,106" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#r9-hair)"/><path d="M197,78 L197,92 L320,92 L320,106" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#r9-hair)"/><rect x="18" y="108" width="132" height="50" rx="2" fill="#DBF1EB" stroke="#C9CFD5" stroke-width="0.8"/><text x="84" y="121" font-size="8.5" fill="#00785A" text-anchor="middle" font-weight="bold">Cantera transient CSTR</text><text x="84" y="133" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">GRI-Mech 3.0, integrated</text><text x="84" y="143" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">X<tspan font-size="8" dy="1.9">dyn</tspan><tspan dy="-1.9">​</tspan> = 0.0491</text><rect x="254" y="108" width="132" height="50" rx="2" fill="#DBEBF4" stroke="#C9CFD5" stroke-width="0.8"/><text x="320" y="121" font-size="8.5" fill="#005B8F" text-anchor="middle" font-weight="bold">CJH map, phase by phase</text><text x="320" y="133" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">outflow-weighted blend</text><text x="320" y="143" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">X<tspan font-size="8" dy="1.9">qs</tspan><tspan dy="-1.9">​</tspan> = 0.00823</text><text x="202" y="130" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">the same</text><text x="202" y="140" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">waveform</text><path d="M84,160 L84,168" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#r9-hair)"/><path d="M320,160 L320,168" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#r9-hair)"/><rect x="18" y="170" width="368" height="30" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.1"/><text x="202" y="183" font-size="9" fill="#111111" text-anchor="middle" font-weight="bold">label  δ  =  logit X<tspan font-size="8" dy="1.9">dyn</tspan><tspan dy="-1.9">​</tspan>  −  logit X<tspan font-size="8" dy="1.9">qs</tspan><tspan dy="-1.9">​</tspan>  =  1.83</text><text x="202" y="194" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">a ratio of odds, so a rare event and a common one are corrected on one scale</text><rect x="396" y="32" width="91" height="168" rx="2" fill="#FBFBFB" stroke="#AEB6BD" stroke-width="0.8" stroke-dasharray="3 2"/><text x="404" y="46" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">THIS CASE</text><text x="404" y="60" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">period / τ</text><text x="479" y="60" font-size="8" fill="#111111" text-anchor="end" font-weight="normal">11.3</text><text x="404" y="72" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">residence τ</text><text x="479" y="72" font-size="8" fill="#111111" text-anchor="end" font-weight="normal">0.767 s</text><text x="404" y="84" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">X<tspan font-size="8" dy="1.9">qs</tspan><tspan dy="-1.9">​</tspan></text><text x="479" y="84" font-size="8" fill="#111111" text-anchor="end" font-weight="normal">0.00823</text><text x="404" y="96" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">X<tspan font-size="8" dy="1.9">dyn</tspan><tspan dy="-1.9">​</tspan></text><text x="479" y="96" font-size="8" fill="#111111" text-anchor="end" font-weight="normal">0.0491</text><text x="404" y="108" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">ratio</text><text x="479" y="108" font-size="8" fill="#111111" text-anchor="end" font-weight="normal">5.97x</text><text x="404" y="120" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">δ observed</text><text x="479" y="120" font-size="8" fill="#111111" text-anchor="end" font-weight="normal">1.83</text><text x="404" y="132" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">δ predicted</text><text x="479" y="132" font-size="8" fill="#A84A00" text-anchor="end" font-weight="bold">1.79</text><text x="404" y="144" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">X predicted</text><text x="479" y="144" font-size="8" fill="#A84A00" text-anchor="end" font-weight="bold">0.0475</text><text x="18" y="218" font-size="11" fill="#111111" text-anchor="start" font-weight="bold">b</text><text x="34" y="218" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">LEARNING AND APPLYING THE CORRECTION</text><rect x="18" y="228" width="128" height="76" rx="2" fill="#FFFFFF" stroke="#C9CFD5" stroke-width="0.8"/><text x="82" y="241" font-size="8.5" fill="#111111" text-anchor="middle" font-weight="bold">Five inputs</text><text x="26" y="253" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">· logit X<tspan font-size="8" dy="1.9">qs</tspan><tspan dy="-1.9">​</tspan>, the baseline itself</text><text x="26" y="263" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">· log₁₀(period / residence time)</text><text x="26" y="273" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">· duty</text><text x="26" y="283" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">· element peak temperature</text><text x="26" y="293" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">· element minimum temperature</text><path d="M146,266 L160,266" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#r9-hair)"/><rect x="161" y="228" width="132" height="76" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.1"/><text x="227" y="242" font-size="9" fill="#111111" text-anchor="middle" font-weight="bold">Gaussian process</text><text x="227" y="253" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">Matérn 5/2</text><text x="227" y="263" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">one length scale per input</text><text x="227" y="275" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">194 cases fitted, 48 held out</text><text x="227" y="285" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">noise σ<tspan font-size="8" dy="1.9">n</tspan><tspan dy="-1.9">​</tspan> = 0.0392 in log-odds</text><text x="227" y="297" font-size="8" fill="#A84A00" text-anchor="middle" font-weight="bold">returns the correction δ</text><path d="M293,266 L307,266" fill="none" stroke="#AEB6BD" stroke-width="0.9" marker-end="url(#r9-hair)"/><rect x="308" y="228" width="179" height="76" rx="2" fill="#F9E9DB" stroke="#C9CFD5" stroke-width="0.8"/><text x="397" y="242" font-size="9" fill="#A84A00" text-anchor="middle" font-weight="bold">X<tspan font-size="8" dy="1.9">pred</tspan><tspan dy="-1.9">​</tspan> = σ( logit X<tspan font-size="8" dy="1.9">qs</tspan><tspan dy="-1.9">​</tspan> + δ )</text><text x="316" y="256" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">The sigmoid cannot leave (0, 1), so no</text><text x="316" y="266" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">correction can return an impossible conversion.</text><text x="316" y="279" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">A zero-mean prior sends δ to 0 away from the</text><text x="316" y="289" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">data, which is also the long-period limit.</text><text x="18" y="308" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">Scope of every number above: CH4:1, CO2:1 at 1 atm, GRI-Mech 3.0, const-pressure, element peak below 1800 °C.</text></svg>