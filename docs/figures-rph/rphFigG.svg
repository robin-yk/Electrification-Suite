<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="205pt" viewBox="0 0 505 205" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="205" fill="#FFFFFF"/><defs><marker id="rg-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="rg-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="rg-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="rg-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="rg-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="rg-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="rg-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="rg-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker><marker id="rg-hair" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#AEB6BD"/></marker><marker id="rg-edge" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C9CFD5"/></marker></defs><rect x="187" y="52" width="130" height="96" rx="6" fill="#F9E9DB" stroke="#A84A00" stroke-width="1.2"/><text x="252" y="86" font-size="9" fill="#A84A00" text-anchor="middle" font-weight="normal">heated void</text><text x="252" y="98" font-size="9" fill="#A84A00" text-anchor="middle" font-weight="normal">11 cm³, 1 atm</text><text x="252" y="112" font-size="9.5" fill="#A84A00" text-anchor="middle" font-weight="bold">1386–1652 °C</text><text x="252" y="126" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">residence 1.8 s</text><path d="M252,18 L252,49" fill="none" stroke="#E69F00" stroke-width="1.6" marker-end="url(#rg-field)"/><text x="260" y="26" font-size="10" fill="#9A6C00" text-anchor="start" font-weight="bold">202 W of electricity</text><text x="260" y="38" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">54 V pulses, 97 ms period, 22 % on</text><text x="42" y="74" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">in</text><text x="42" y="88" font-size="10.5" fill="#00785A" text-anchor="start" font-weight="bold">CH₄  2.0 g/h</text><text x="42" y="102" font-size="10.5" fill="#00785A" text-anchor="start" font-weight="bold">CO₂  1.4 g/h</text><text x="42" y="115" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">(3.8 : 1 by mole)</text><path d="M124,94 L183,94" fill="none" stroke="#009E73" stroke-width="1.6" marker-end="url(#rg-gas)"/><path d="M319,94 L333,94" fill="none" stroke="#0072B2" stroke-width="1.6" marker-end="url(#rg-scalar)"/><text x="339" y="74" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">out</text><text x="339" y="88" font-size="10.5" fill="#005B8F" text-anchor="start" font-weight="bold">C₂H₂  1.1 g/h</text><text x="339" y="102" font-size="10.5" fill="#005B8F" text-anchor="start" font-weight="bold">CO  1.7 g/h</text><text x="339" y="115" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">H₂ 0.38 g/h; CH₄ left 0.09 g/h</text><path d="M30,160 L475,160" fill="none" stroke="#BBBBBB" stroke-width="0.5"/><text x="30" y="172" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">96 % of the methane converts, but of the 202 W drawn only 7 W ends up stored in the molecules.</text><text x="30" y="183" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">The rest leaks from a small object glowing at 1600 °C. So the 182 kWh per kilogram of acetylene here is an</text><text x="30" y="194" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">insulation problem, not a chemistry problem.</text></svg>