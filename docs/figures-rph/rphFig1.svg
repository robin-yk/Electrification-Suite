<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="332pt" viewBox="0 0 505 332" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="332" fill="#FFFFFF"/><defs><marker id="r1-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="r1-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="r1-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="r1-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="r1-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="r1-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="r1-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="r1-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker><marker id="r1-hair" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#AEB6BD"/></marker><marker id="r1-edge" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#C9CFD5"/></marker></defs><rect x="18" y="20" width="469" height="118" rx="2" fill="#FFFFFF" stroke="#C9CFD5" stroke-width="0.8"/><rect x="18" y="20" width="469" height="20" fill="#DBF1EB"/><path d="M18,40 L487,40" fill="none" stroke="#009E73" stroke-width="1"/><text x="28" y="34" font-size="9" fill="#00785A" text-anchor="start" font-weight="bold">THE TWO-STEP TOY</text><text x="477" y="34" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">why does pulsing help at all</text><rect x="30" y="50" width="214" height="60" rx="2" fill="#FBFBFB" stroke="#AEB6BD" stroke-width="0.7"/><text x="38" y="64" font-size="9" fill="#00785A" text-anchor="start" font-weight="bold">Ideal rate averaging</text><text x="236" y="64" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">When Pulsing Helps</text><text x="38" y="77" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">one activation energy and a duty</text><text x="38" y="87" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">compares ⟨k⟩ against k(⟨T⟩)</text><text x="38" y="97" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">answers before anything is integrated</text><rect x="258" y="50" width="214" height="60" rx="2" fill="#FBFBFB" stroke="#AEB6BD" stroke-width="0.7"/><text x="266" y="64" font-size="9" fill="#00785A" text-anchor="start" font-weight="bold">Two-step network</text><text x="464" y="64" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">A → B → C</text><text x="266" y="77" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">two steps with different activation energies</text><text x="266" y="87" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">periodic CSTR on the drive's own T(t)</text><text x="266" y="97" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">intermediate yield at equal conversion</text><text x="28" y="128" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">Arbitrary kinetics, so the yields are not a claim about any real chemistry. It is the interpretable layer.</text><rect x="18" y="154" width="469" height="118" rx="2" fill="#FFFFFF" stroke="#C9CFD5" stroke-width="0.8"/><rect x="18" y="154" width="469" height="20" fill="#F9E9DB"/><path d="M18,174 L487,174" fill="none" stroke="#D55E00" stroke-width="1"/><text x="28" y="168" font-size="9" fill="#A84A00" text-anchor="start" font-weight="bold">THE DETAILED-CHEMISTRY PREDICTOR</text><text x="477" y="168" font-size="8.5" fill="#6E6E6E" text-anchor="end" font-weight="normal">how much methane actually converts</text><rect x="30" y="184" width="214" height="60" rx="2" fill="#FBFBFB" stroke="#AEB6BD" stroke-width="0.7"/><text x="38" y="198" font-size="9" fill="#A84A00" text-anchor="start" font-weight="bold">Conversion prediction</text><text x="236" y="198" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">Kinetic Effect</text><text x="38" y="211" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">voltage, period, duty, residence time</text><text x="38" y="221" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">CJH conversion from the steady map</text><text x="38" y="231" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">RPH conversion from map plus correction</text><rect x="258" y="184" width="214" height="60" rx="2" fill="#FBFBFB" stroke="#AEB6BD" stroke-width="0.7"/><text x="266" y="198" font-size="9" fill="#A84A00" text-anchor="start" font-weight="bold">Provenance of the model</text><text x="464" y="198" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">How RPH Is Predicted</text><text x="266" y="211" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">the map, the transients, the frozen model</text><text x="266" y="221" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">the independent test and its criteria</text><text x="266" y="231" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">the domain outside which nothing is reported</text><text x="28" y="262" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">GRI-Mech 3.0 on a fixed feed. Conversion only: no selectivity is predicted here, because none was validated.</text><path d="M252,138 L252,154" fill="none" stroke="#AEB6BD" stroke-width="0.8" stroke-dasharray="2 2"/><text x="258" y="150" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">both layers drive off the same element T(t)</text><rect x="18" y="282" width="469" height="28" rx="2" fill="#EDEFF1" stroke="#AEB6BD" stroke-width="0.8" stroke-dasharray="3 2"/><text x="28" y="299" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">SUPPORTING</text><text x="120" y="294" font-size="8.5" fill="#4A5058" text-anchor="start" font-weight="bold">Calculations</text><text x="120" y="304" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">every equation the page evaluates</text><text x="310" y="294" font-size="8.5" fill="#4A5058" text-anchor="start" font-weight="bold">How to Cite</text><text x="310" y="304" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">the paper this tool accompanies</text><text x="18" y="326" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">Every tab calls apps/rphcjh/solver.js, and the predictor adds apps/rphcjh/surrogate.js, so the browser and the tests run identical code.</text></svg>