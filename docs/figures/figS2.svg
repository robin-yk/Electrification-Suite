<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="396pt" viewBox="0 0 505 396" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="396" fill="#FFFFFF"/><defs><marker id="s2-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="s2-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="s2-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="s2-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="s2-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="s2-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="s2-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="s2-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker></defs><text x="30" y="22" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="bold">Cells coupled</text><text x="168" y="22" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="bold">Matrix position</text><text x="168" y="32" font-size="8" fill="#8A8A8A" text-anchor="start" font-weight="normal">schematic; the 30 × 60 mesh has 1800 unknowns</text><text x="268" y="22" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="bold">Term</text><path d="M30,26 L495,26" fill="none" stroke="#111111" stroke-width="0.9"/><rect x="70" y="34" width="20" height="20" rx="0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.7"/><rect x="50" y="54" width="20" height="20" rx="0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.7"/><rect x="70" y="54" width="20" height="20" rx="0" fill="#FBE9DF" stroke="#D55E00" stroke-width="0.7"/><rect x="90" y="54" width="20" height="20" rx="0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.7"/><rect x="70" y="74" width="20" height="20" rx="0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.7"/><text x="80" y="67.2" font-size="9" fill="#D55E00" text-anchor="middle" font-weight="bold">P</text><path d="M80,51 L80,37" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#s2-thermal)" marker-start="url(#s2-thermal)"/><path d="M80,77 L80,91" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#s2-thermal)" marker-start="url(#s2-thermal)"/><path d="M67,64 L53,64" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#s2-thermal)" marker-start="url(#s2-thermal)"/><path d="M93,64 L107,64" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#s2-thermal)" marker-start="url(#s2-thermal)"/><rect x="168" y="36" width="56" height="56" rx="0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.7"/><path d="M168,43 L224,43" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M175,36 L175,92" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,50 L224,50" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M182,36 L182,92" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,57 L224,57" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M189,36 L189,92" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,64 L224,64" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M196,36 L196,92" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,71 L224,71" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M203,36 L203,92" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,78 L224,78" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M210,36 L210,92" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,85 L224,85" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M217,36 L217,92" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><rect x="168" y="36" width="7" height="7" fill="#D55E00"/><rect x="175" y="36" width="7" height="7" fill="#D55E00"/><rect x="189" y="36" width="7" height="7" fill="#D55E00"/><rect x="175" y="43" width="7" height="7" fill="#D55E00"/><rect x="168" y="43" width="7" height="7" fill="#D55E00"/><rect x="182" y="43" width="7" height="7" fill="#D55E00"/><rect x="196" y="43" width="7" height="7" fill="#D55E00"/><rect x="182" y="50" width="7" height="7" fill="#D55E00"/><rect x="175" y="50" width="7" height="7" fill="#D55E00"/><rect x="189" y="50" width="7" height="7" fill="#D55E00"/><rect x="203" y="50" width="7" height="7" fill="#D55E00"/><rect x="189" y="57" width="7" height="7" fill="#D55E00"/><rect x="182" y="57" width="7" height="7" fill="#D55E00"/><rect x="196" y="57" width="7" height="7" fill="#D55E00"/><rect x="168" y="57" width="7" height="7" fill="#D55E00"/><rect x="210" y="57" width="7" height="7" fill="#D55E00"/><rect x="196" y="64" width="7" height="7" fill="#D55E00"/><rect x="189" y="64" width="7" height="7" fill="#D55E00"/><rect x="203" y="64" width="7" height="7" fill="#D55E00"/><rect x="175" y="64" width="7" height="7" fill="#D55E00"/><rect x="217" y="64" width="7" height="7" fill="#D55E00"/><rect x="203" y="71" width="7" height="7" fill="#D55E00"/><rect x="196" y="71" width="7" height="7" fill="#D55E00"/><rect x="210" y="71" width="7" height="7" fill="#D55E00"/><rect x="182" y="71" width="7" height="7" fill="#D55E00"/><rect x="210" y="78" width="7" height="7" fill="#D55E00"/><rect x="203" y="78" width="7" height="7" fill="#D55E00"/><rect x="217" y="78" width="7" height="7" fill="#D55E00"/><rect x="189" y="78" width="7" height="7" fill="#D55E00"/><rect x="217" y="85" width="7" height="7" fill="#D55E00"/><rect x="210" y="85" width="7" height="7" fill="#D55E00"/><rect x="196" y="85" width="7" height="7" fill="#D55E00"/><text x="268" y="44" font-size="9.5" fill="#D55E00" text-anchor="start" font-weight="bold">Adjacent-cell conduction</text><text x="268" y="57" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">Two-point flux across the shared face, with the two</text><text x="268" y="68" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">half-cell resistances in series. Fills the bands next</text><text x="268" y="79" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">to the diagonal, and is symmetric.</text><path d="M30,102 L495,102" fill="none" stroke="#E4E4E4" stroke-width="0.5"/><rect x="60" y="136" width="20" height="20" rx="0" fill="#FBE9DF" stroke="#D55E00" stroke-width="0.7"/><path d="M88,124 L88,176" fill="none" stroke="#111111" stroke-width="1.6"/><path d="M82,146 L104,146" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#s2-thermal)"/><text x="92" y="138" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">to ambient</text><text x="80" y="172" font-size="8" fill="#6E6E6E" text-anchor="end" font-weight="normal">boundary cell</text><rect x="168" y="118" width="56" height="56" rx="0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.7"/><path d="M168,125 L224,125" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M175,118 L175,174" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,132 L224,132" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M182,118 L182,174" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,139 L224,139" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M189,118 L189,174" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,146 L224,146" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M196,118 L196,174" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,153 L224,153" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M203,118 L203,174" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,160 L224,160" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M210,118 L210,174" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,167 L224,167" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M217,118 L217,174" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><rect x="168" y="118" width="7" height="7" fill="#D55E00"/><rect x="175" y="125" width="7" height="7" fill="#D55E00"/><rect x="182" y="132" width="7" height="7" fill="#D55E00"/><rect x="189" y="139" width="7" height="7" fill="#D55E00"/><rect x="196" y="146" width="7" height="7" fill="#D55E00"/><rect x="203" y="153" width="7" height="7" fill="#D55E00"/><rect x="210" y="160" width="7" height="7" fill="#D55E00"/><rect x="217" y="167" width="7" height="7" fill="#D55E00"/><text x="268" y="126" font-size="9.5" fill="#D55E00" text-anchor="start" font-weight="bold">Boundary convection and radiation</text><text x="268" y="139" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">Adds to the diagonal and to the right-hand side only.</text><text x="268" y="150" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">The radiation coefficient is linearized about the</text><text x="268" y="161" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">current temperature, and is symmetric.</text><path d="M30,184 L495,184" fill="none" stroke="#E4E4E4" stroke-width="0.5"/><rect x="36" y="218" width="20" height="20" rx="0" fill="#FCF0DC" stroke="#E69F00" stroke-width="0.7"/><rect x="56" y="218" width="34" height="20" fill="#E4F5EF" stroke="none"/><rect x="90" y="218" width="20" height="20" rx="0" fill="#E8E8E8" stroke="#6E6E6E" stroke-width="0.7"/><path d="M59,228 L87,228" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#s2-thermal)" marker-start="url(#s2-thermal)"/><text x="73" y="212" font-size="8" fill="#009E73" text-anchor="middle" font-weight="normal">gap</text><text x="36" y="254" font-size="8" fill="#E69F00" text-anchor="start" font-weight="normal">element</text><text x="90" y="254" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">wall</text><rect x="168" y="200" width="56" height="56" rx="0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.7"/><path d="M168,207 L224,207" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M175,200 L175,256" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,214 L224,214" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M182,200 L182,256" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,221 L224,221" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M189,200 L189,256" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,228 L224,228" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M196,200 L196,256" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,235 L224,235" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M203,200 L203,256" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,242 L224,242" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M210,200 L210,256" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,249 L224,249" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M217,200 L217,256" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><rect x="210" y="207" width="7" height="7" fill="#D55E00"/><rect x="175" y="242" width="7" height="7" fill="#D55E00"/><rect x="217" y="214" width="7" height="7" fill="#D55E00"/><rect x="182" y="249" width="7" height="7" fill="#D55E00"/><text x="268" y="208" font-size="9.5" fill="#D55E00" text-anchor="start" font-weight="bold">Element-to-wall radiation</text><text x="268" y="221" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">Couples two cells that share no face, across the gas</text><text x="268" y="232" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">gap. The entries sit far from the diagonal, and appear</text><text x="268" y="243" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">in matching pairs, so the operator stays symmetric.</text><path d="M30,266 L495,266" fill="none" stroke="#E4E4E4" stroke-width="0.5"/><rect x="60" y="314" width="20" height="20" rx="0" fill="#E4F5EF" stroke="#009E73" stroke-width="0.7"/><rect x="60" y="294" width="20" height="20" rx="0" fill="#E4F5EF" stroke="#009E73" stroke-width="0.7"/><path d="M88,334 L88,294" fill="none" stroke="#009E73" stroke-width="1.4" marker-end="url(#s2-gas)"/><text x="94" y="317" font-size="8" fill="#009E73" text-anchor="start" font-weight="normal">flow</text><text x="60" y="346" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">upstream cell only</text><rect x="168" y="282" width="56" height="56" rx="0" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.7"/><path d="M168,289 L224,289" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M175,282 L175,338" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,296 L224,296" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M182,282 L182,338" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,303 L224,303" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M189,282 L189,338" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,310 L224,310" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M196,282 L196,338" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,317 L224,317" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M203,282 L203,338" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,324 L224,324" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M210,282 L210,338" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M168,331 L224,331" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><path d="M217,282 L217,338" fill="none" stroke="#E6E6E6" stroke-width="0.3"/><rect x="182" y="303" width="7" height="7" fill="#009E73"/><rect x="189" y="310" width="7" height="7" fill="#009E73"/><rect x="196" y="317" width="7" height="7" fill="#009E73"/><rect x="189.6" y="296.6" width="5.8" height="5.8" fill="none" stroke="#009E73" stroke-width="0.7" stroke-dasharray="1.5 1.2"/><rect x="196.6" y="303.6" width="5.8" height="5.8" fill="none" stroke="#009E73" stroke-width="0.7" stroke-dasharray="1.5 1.2"/><rect x="203.6" y="310.6" width="5.8" height="5.8" fill="none" stroke="#009E73" stroke-width="0.7" stroke-dasharray="1.5 1.2"/><text x="268" y="290" font-size="9.5" fill="#009E73" text-anchor="start" font-weight="bold">Directed process-gas enthalpy transport</text><text x="268" y="303" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">The cell upstream in the flow direction contributes; the</text><text x="268" y="314" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">cell downstream does not. The matching entry is absent,</text><text x="268" y="325" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">shown dashed, so the operator is not symmetric.</text><path d="M30,356 L495,356" fill="none" stroke="#111111" stroke-width="0.9"/><text x="30" y="370" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">The first three terms preserve matrix symmetry. Directed gas enthalpy transport produces a nonsymmetric</text><text x="30" y="382" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">operator and activates BiCGSTAB.</text></svg>