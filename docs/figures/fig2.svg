<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="406pt" viewBox="0 0 505 406" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="406" fill="#FFFFFF"/><defs><marker id="f2-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="f2-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="f2-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="f2-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="f2-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="f2-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="f2-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="f2-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker></defs><text x="32" y="20" font-size="9.5" fill="#111111" text-anchor="start" font-weight="bold">Rectangular element, as specified</text><text x="300" y="20" font-size="9.5" fill="#111111" text-anchor="start" font-weight="bold">Cylinder the axisymmetric solver meshes</text><rect x="32" y="30" width="170.012" height="35.792" rx="0" fill="#FCF0DC" stroke="#E69F00" stroke-width="1"/><text x="117.006" y="51.096000000000004" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">plan</text><path d="M32,78 L202.012,78" fill="none" stroke="#6E6E6E" stroke-width="0.6"/><text x="117.006" y="88" font-size="8.5" fill="#111111" text-anchor="middle" font-weight="normal">38.00 mm</text><path d="M24,30 L24,65.792" fill="none" stroke="#6E6E6E" stroke-width="0.6"/><text x="16" y="47.896" font-size="8.5" fill="#111111" text-anchor="middle" transform="rotate(-90 16 47.896)">8.00 mm</text><rect x="32" y="100" width="170.012" height="0.93954" rx="0" fill="#E69F00" stroke="#E69F00" stroke-width="0.6"/><text x="32" y="116" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">edge view, drawn to the same scale</text><path d="M232.012,101 L206.012,100.46977" fill="none" stroke="#6E6E6E" stroke-width="0.6" marker-end="url(#f2-grey)"/><text x="235.012" y="104" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">0.21 mm</text><path d="M216,52 L288,52" fill="none" stroke="#111111" stroke-width="1.1" marker-end="url(#f2-ink)"/><text x="252" y="44" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">surface-equivalent</text><text x="252" y="64" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">mapping</text><rect x="300" y="40" width="170.012" height="22.074716000000002" rx="0" fill="#FCF0DC" stroke="#E69F00" stroke-width="1"/><ellipse cx="300" cy="51.037358" rx="3.2" ry="11.037358000000001" fill="#FCF0DC" stroke="#E69F00" stroke-width="1"/><ellipse cx="470.012" cy="51.037358" rx="3.2" ry="11.037358000000001" fill="none" stroke="#E69F00" stroke-width="1"/><path d="M300,78 L470.012,78" fill="none" stroke="#6E6E6E" stroke-width="0.6"/><text x="385.006" y="88" font-size="8.5" fill="#111111" text-anchor="middle" font-weight="normal">38.00 mm</text><path d="M292,40 L292,62.074716" fill="none" stroke="#6E6E6E" stroke-width="0.6"/><text x="470.012" y="34" font-size="8.5" fill="#111111" text-anchor="end" font-weight="normal">D = 4.934 mm</text><text x="300" y="116" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">the diameter follows from the surface, not the volume</text><path d="M32,134 L480,134" fill="none" stroke="#111111" stroke-width="0.9"/><text x="32" y="146" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="bold">Quantity</text><text x="214" y="146" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="bold">Rectangular</text><text x="316" y="146" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="bold">Cylinder</text><text x="404" y="146" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="bold">Relation</text><path d="M32,151 L480,151" fill="none" stroke="#111111" stroke-width="0.9"/><text x="32" y="166" font-size="8" fill="#0072B2" text-anchor="start" font-weight="bold">PRESERVED BY CONSTRUCTION</text><path d="M32,169.5 L480,169.5" fill="none" stroke="#0072B2" stroke-width="0.5"/><text x="32" y="182" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">Length</text><text x="214" y="182" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">38.00 mm</text><text x="316" y="182" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">38.00 mm</text><text x="404" y="182" font-size="9" fill="#6E6E6E" text-anchor="start" font-weight="normal">identical</text><path d="M32,186.5 L480,186.5" fill="none" stroke="#E4E4E4" stroke-width="0.4"/><text x="32" y="199" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">Radiating surface</text><text x="214" y="199" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">6.273 cm²</text><text x="316" y="199" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">6.273 cm²</text><text x="404" y="199" font-size="9" fill="#6E6E6E" text-anchor="start" font-weight="normal">identical</text><path d="M32,203.5 L480,203.5" fill="none" stroke="#E4E4E4" stroke-width="0.4"/><text x="32" y="216" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">Mass</text><text x="214" y="216" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">28.8 mg</text><text x="316" y="216" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">28.8 mg</text><text x="404" y="216" font-size="9" fill="#6E6E6E" text-anchor="start" font-weight="normal">identical</text><path d="M32,220.5 L480,220.5" fill="none" stroke="#E4E4E4" stroke-width="0.4"/><text x="32" y="233" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">Electrical resistance</text><text x="214" y="233" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">4.232 Ω</text><text x="316" y="233" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">4.232 Ω</text><text x="404" y="233" font-size="9" fill="#6E6E6E" text-anchor="start" font-weight="normal">identical</text><path d="M32,237.5 L480,237.5" fill="none" stroke="#E4E4E4" stroke-width="0.4"/><text x="32" y="250" font-size="8" fill="#D55E00" text-anchor="start" font-weight="bold">NOT PRESERVED</text><path d="M32,253.5 L480,253.5" fill="none" stroke="#D55E00" stroke-width="0.5"/><text x="32" y="266" font-size="9" fill="#D55E00" text-anchor="start" font-weight="normal">Geometric volume</text><text x="214" y="266" font-size="9" fill="#D55E00" text-anchor="start" font-weight="normal">0.06384 cm³</text><text x="316" y="266" font-size="9" fill="#D55E00" text-anchor="start" font-weight="normal">0.7267 cm³</text><text x="404" y="266" font-size="9" fill="#D55E00" text-anchor="start" font-weight="bold">larger by ×11.38</text><path d="M32,270.5 L480,270.5" fill="none" stroke="#E4E4E4" stroke-width="0.4"/><text x="32" y="283" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">DERIVED TO HOLD THE FOUR ABOVE</text><path d="M32,286.5 L480,286.5" fill="none" stroke="#6E6E6E" stroke-width="0.5"/><text x="32" y="299" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">Diameter</text><text x="214" y="299" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">—</text><text x="316" y="299" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">4.934 mm</text><text x="404" y="299" font-size="9" fill="#6E6E6E" text-anchor="start" font-weight="normal">set by the surface</text><path d="M32,303.5 L480,303.5" fill="none" stroke="#E4E4E4" stroke-width="0.4"/><text x="32" y="316" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">Effective density</text><text x="214" y="316" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">451.1 kg/m³</text><text x="316" y="316" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">39.63 kg/m³</text><text x="404" y="316" font-size="9" fill="#6E6E6E" text-anchor="start" font-weight="normal">×0.08785</text><path d="M32,320.5 L480,320.5" fill="none" stroke="#E4E4E4" stroke-width="0.4"/><text x="32" y="333" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">Effective resistivity</text><text x="214" y="333" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">0.01871 Ω·cm</text><text x="316" y="333" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">0.2130 Ω·cm</text><text x="404" y="333" font-size="9" fill="#6E6E6E" text-anchor="start" font-weight="normal">×11.38</text><path d="M32,337.5 L480,337.5" fill="none" stroke="#E4E4E4" stroke-width="0.4"/><path d="M32,354 L480,354" fill="none" stroke="#111111" stroke-width="0.9"/><text x="32" y="368" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">Surface is 2(LW + LH + WH) = 6.273 cm². The two-face convention 2LW gives 6.080 cm² and omits the edges,</text><text x="32" y="379" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">which are 3.08 % of the total. The solver uses the first convention everywhere.</text><text x="32" y="393" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">The zero-dimensional solve uses the three rectangular dimensions as they are. This substitution applies only to</text><text x="32" y="404" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">the axisymmetric solves, which cannot mesh a box.</text></svg>