<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="388pt" viewBox="0 0 505 388" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="388" fill="#FFFFFF"/><defs><marker id="s8-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="s8-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="s8-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="s8-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="s8-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="s8-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="s8-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="s8-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker></defs><text x="18" y="22" font-size="11" fill="#111111" text-anchor="start" font-weight="bold">a</text><rect x="18" y="34" width="104" height="34" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="1"/><text x="70" y="48" font-size="9" fill="#0072B2" text-anchor="middle" font-weight="bold">Physical specification</text><text x="70" y="59" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">and its assumptions</text><path d="M122,51 L136,51" fill="none" stroke="#0072B2" stroke-width="0.9" marker-end="url(#s8-scalar)"/><rect x="137" y="34" width="82" height="34" rx="2" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="1"/><text x="178" y="48" font-size="9" fill="#6E6E6E" text-anchor="middle" font-weight="bold">Implementation</text><text x="178" y="59" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">assisted</text><path d="M219,51 L233,51" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#s8-grey)"/><rect x="234" y="34" width="96" height="34" rx="2" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="1"/><text x="282" y="48" font-size="9" fill="#6E6E6E" text-anchor="middle" font-weight="bold">Independent review</text><text x="282" y="59" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">a second model</text><path d="M330,51 L344,51" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#s8-grey)"/><rect x="345" y="30" width="82" height="42" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/><text x="386" y="45" font-size="9" fill="#111111" text-anchor="middle" font-weight="bold">Verification</text><text x="386" y="56" font-size="9" fill="#111111" text-anchor="middle" font-weight="bold">gates</text><path d="M427,51 L441,51" fill="none" stroke="#009E73" stroke-width="0.9" marker-end="url(#s8-gas)"/><rect x="442" y="34" width="45" height="34" rx="2" fill="#E4F5EF" stroke="#009E73" stroke-width="1"/><text x="464.5" y="48" font-size="9" fill="#009E73" text-anchor="middle" font-weight="bold">Release</text><text x="464.5" y="59" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">versioned</text><text x="434" y="26" font-size="8" fill="#009E73" text-anchor="start" font-weight="normal">pass</text><path d="M386,72 L386,96 L178,96 L178,69" fill="none" stroke="#D55E00" stroke-width="1" marker-end="url(#s8-thermal)"/><text x="282" y="93" font-size="8" fill="#D55E00" text-anchor="middle" font-weight="normal">fail</text><text x="18" y="112" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">The gates are the repository's own: regression tests, energy closure, the analytic and manufactured-solution</text><text x="18" y="123" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">benchmarks, and grid convergence. Every physical and numerical decision is adjudicated by the human author.</text><text x="18" y="152" font-size="11" fill="#111111" text-anchor="start" font-weight="bold">b</text><rect x="232" y="196" width="118" height="40" rx="2" fill="#FBE9DF" stroke="#D55E00" stroke-width="1.2"/><text x="291" y="213" font-size="10" fill="#D55E00" text-anchor="middle" font-weight="bold">solver.js</text><text x="291" y="225" font-size="8" fill="#6E6E6E" text-anchor="middle" font-weight="normal">DOM-free numerical core</text><rect x="18" y="164" width="150" height="24" rx="2" fill="#FFFFFF" stroke="#0072B2" stroke-width="0.9"/><text x="26" y="174" font-size="8.5" fill="#0072B2" text-anchor="start" font-weight="bold">Material presets</text><text x="26" y="184" font-size="7.6" fill="#6E6E6E" text-anchor="start" font-weight="normal">temperature-dependent properties</text><path d="M168,176 L230,216" fill="none" stroke="#6E6E6E" stroke-width="0.8" marker-end="url(#s8-grey)"/><rect x="18" y="196" width="150" height="24" rx="2" fill="#FFFFFF" stroke="#E69F00" stroke-width="0.9"/><text x="26" y="206" font-size="8.5" fill="#E69F00" text-anchor="start" font-weight="bold">Geometry, wall, gas</text><text x="26" y="216" font-size="7.6" fill="#6E6E6E" text-anchor="start" font-weight="normal">the boundary-condition configuration</text><path d="M168,208 L230,216" fill="none" stroke="#6E6E6E" stroke-width="0.8" marker-end="url(#s8-grey)"/><rect x="18" y="228" width="150" height="24" rx="2" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.9"/><text x="26" y="238" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="bold">Browser interface</text><text x="26" y="248" font-size="7.6" fill="#6E6E6E" text-anchor="start" font-weight="normal">inputs and outputs only</text><path d="M168,240 L230,216" fill="none" stroke="#6E6E6E" stroke-width="0.8" marker-end="url(#s8-grey)"/><rect x="18" y="260" width="150" height="24" rx="2" fill="#FFFFFF" stroke="#009E73" stroke-width="0.9" stroke-dasharray="3 2"/><text x="26" y="270" font-size="8.5" fill="#009E73" text-anchor="start" font-weight="bold">Verification suite</text><text x="26" y="280" font-size="7.2" fill="#6E6E6E" text-anchor="start" font-weight="normal">regression, conservation, benchmarks</text><path d="M168,272 L230,232" fill="none" stroke="#009E73" stroke-width="0.8" marker-end="url(#s8-gas)"/><path d="M350,216 L364,216" fill="none" stroke="#D55E00" stroke-width="0.9" marker-end="url(#s8-thermal)"/><rect x="365" y="190" width="108" height="52" rx="2" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.9"/><text x="373" y="202" font-size="8" fill="#111111" text-anchor="start" font-weight="normal">2D field and diagnostics</text><text x="373" y="213" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">loss partition, closure</text><text x="373" y="224" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">CSV export</text><text x="373" y="235" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">these figures</text><path d="M18,302 L487,302" fill="none" stroke="#111111" stroke-width="0.9"/><text x="18" y="316" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="bold">WHAT A CHANGE TOUCHES</text><text x="26" y="330" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">add a material</text><text x="178" y="330" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">the preset and its property functions; nothing else</text><text x="26" y="342" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">change the shape, wall or gas</text><text x="178" y="342" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">the boundary-condition configuration</text><text x="26" y="354" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">change the interface</text><text x="178" y="354" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">the input and output layer; the core is untouched</text><text x="26" y="366" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">change the calculation</text><text x="178" y="366" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">solver.js, and the verification scripts that check it</text><text x="26" y="378" font-size="8.5" fill="#111111" text-anchor="start" font-weight="normal">any of the above</text><text x="178" y="378" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">rerun the same regression and conservation tests</text></svg>