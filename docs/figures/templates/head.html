<title>Joule Solver Figure Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ------------------------------------------------------------------
   A proof sheet. The page chrome follows the viewer's theme; the
   plates never do, because they are print artwork and have to be
   judged on the paper they will be printed on.
   ------------------------------------------------------------------ */
:root{
  --paper:#FAFAF7; --surface:#FFFFFF; --ink:#14171A; --muted:#565D65;
  --faint:#868D95; --rule:#DEE1E4; --rule-strong:#B9BEC4; --well:#F2F2EE;
  --accent:#0072B2; --warn:#D55E00;
  --plate-bg:#FFFFFF; --plate-edge:#D8DBDE; --plate-shade:transparent;
  /* one hue per physical role, identical in every figure */
  --c-scalar:#0072B2; --c-field:#E69F00; --c-thermal:#D55E00;
  --c-gas:#009E73; --c-grey:#6E6E6E;
  --sans:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131619; --surface:#1A1E22; --ink:#E9EBED; --muted:#A2A9B0;
    --faint:#7B838B; --rule:#2A2F35; --rule-strong:#3C434A; --well:#1E2227;
    --accent:#5CB3E4; --warn:#F08C4B;
    --plate-edge:#3C434A; --plate-shade:#0A0C0E;
  }
}
:root[data-theme="dark"]{
  --paper:#131619; --surface:#1A1E22; --ink:#E9EBED; --muted:#A2A9B0;
  --faint:#7B838B; --rule:#2A2F35; --rule-strong:#3C434A; --well:#1E2227;
  --accent:#5CB3E4; --warn:#F08C4B;
  --plate-edge:#3C434A; --plate-shade:#0A0C0E;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto;padding:0 28px 96px}

/* ---- masthead ---- */
header{padding:56px 0 26px;border-bottom:1px solid var(--rule-strong);margin-bottom:26px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin:0 0 14px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,4.6vw,46px);line-height:1.06;
  letter-spacing:-.015em;margin:0 0 16px;text-wrap:balance;max-width:20ch}
.sub{color:var(--muted);max-width:66ch;margin:0;font-size:16.5px}
.stamp{margin:22px 0 0;display:flex;flex-wrap:wrap;gap:6px 26px;
  font-family:var(--mono);font-size:11.5px;color:var(--faint)}
.stamp b{color:var(--ink);font-weight:500}

/* ---- notes and register ---- */
.note{background:var(--well);border:1px solid var(--rule);border-radius:2px;
  padding:18px 20px;margin:24px 0;font-size:14.5px;color:var(--muted);max-width:78ch}
.note b{color:var(--ink);font-weight:600}
.note code{font-family:var(--mono);font-size:12.5px;color:var(--ink)}
.key{display:flex;flex-wrap:wrap;gap:8px 24px;margin:22px 0 0;
  font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.key i{display:inline-block;width:22px;height:9px;margin-right:7px;vertical-align:0}

/* ---- plates ---- */
figure{margin:52px 0 0;padding:0}
.figbar{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:baseline;
  border-bottom:1px solid var(--rule-strong);padding-bottom:9px;margin-bottom:0}
.figno{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:-.01em}
.figwhere{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.figsize{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:auto;letter-spacing:.02em}
.plate{background:var(--plate-bg);border:1px solid var(--plate-edge);border-top:none;
  padding:16px;overflow-x:auto;box-shadow:0 0 0 6px var(--plate-shade)}
.plate svg{display:block;width:100%;height:auto;min-width:480px}
.tools{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:12px;align-items:center}
button{font:inherit;font-size:13px;font-family:var(--mono);letter-spacing:.01em;
  padding:7px 13px;border:1px solid var(--rule-strong);background:var(--surface);
  color:var(--ink);cursor:pointer;border-radius:2px}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted);flex:1 1 240px}
textarea{width:100%;height:150px;font-family:var(--mono);font-size:11px;line-height:1.45;
  border:1px solid var(--rule);border-radius:2px;padding:10px;margin-top:10px;display:none;
  background:var(--surface);color:var(--ink);resize:vertical}
textarea.on{display:block}
canvas{max-width:100%;height:auto;border:1px solid var(--plate-edge);margin-top:10px;display:none;
  background:#FFFFFF}
canvas.on{display:block}
.cap{margin-top:14px;padding-left:16px;border-left:2px solid var(--rule-strong);
  font-size:14px;color:var(--muted);max-width:76ch}
.cap b{color:var(--ink);font-weight:600}

/* ---- tables ---- */
h2{font-family:var(--serif);font-weight:600;font-size:26px;letter-spacing:-.012em;
  margin:64px 0 8px;text-wrap:balance}
.lede{color:var(--muted);max-width:72ch;margin:0 0 6px;font-size:14.5px}
.tablewrap{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px;
  font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:11px 16px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--faint);border-bottom:1px solid var(--rule-strong);font-weight:500;padding-bottom:8px}
td.q{width:32%;color:var(--ink)}
td.s,td.n{width:11%;font-family:var(--mono);font-size:12px;letter-spacing:.02em;
  text-transform:uppercase;white-space:nowrap}
td.s{color:var(--c-gas);font-weight:500}
td.n{color:var(--warn);font-weight:500}
td:last-child{color:var(--muted)}
.swatch{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.swatch i{display:inline-block;width:22px;height:9px;margin-right:8px;vertical-align:0}

footer{margin-top:72px;padding-top:20px;border-top:1px solid var(--rule-strong);
  font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--faint);max-width:80ch}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
