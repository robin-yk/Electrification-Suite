<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="636pt" viewBox="0 0 505 636" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="636" fill="#FFFFFF"/><defs><marker id="f1-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="f1-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="f1-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="f1-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="f1-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="f1-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="f1-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="f1-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker></defs><rect x="127.5" y="12" width="250" height="28" rx="2" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="1"/><text x="252.5" y="25" font-size="9.5" fill="#6E6E6E" text-anchor="middle" font-weight="bold">Inputs</text><text x="252.5" y="36" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">geometry, material, drive setting, enclosure</text><path d="M252.5,40 L252.5,53" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#f1-grey)"/><rect x="127.5" y="54" width="250" height="28" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="1"/><text x="252.5" y="67" font-size="9.5" fill="#0072B2" text-anchor="middle" font-weight="bold">Zero-dimensional steady state</text><text x="252.5" y="78" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">one temperature, used as the seed</text><path d="M252.5,82 L252.5,95" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#f1-grey)"/><rect x="127.5" y="96" width="250" height="28" rx="2" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="1"/><text x="252.5" y="109" font-size="9.5" fill="#6E6E6E" text-anchor="middle" font-weight="bold">Build the axisymmetric mesh</text><text x="252.5" y="120" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">built once and held fixed</text><path d="M252.5,124 L252.5,137" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#f1-grey)"/><rect x="26" y="138" width="453" height="254" rx="2" fill="#FBFBFB" stroke="#111111" stroke-width="1.1" stroke-dasharray="3 2"/><text x="36" y="153" font-size="10" fill="#111111" text-anchor="start" font-weight="bold">Outer Picard iteration</text><text x="163" y="153" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">coefficients re-evaluated from the current temperature field</text><text x="34" y="171" font-size="9.5" fill="#0072B2" text-anchor="start" font-weight="bold">Scalar electrical</text><text x="34" y="181" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">returns one number</text><rect x="34" y="186" width="137" height="17" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="0.8"/><text x="40" y="197.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">T<tspan font-size="8" dy="1.9">avg</tspan><tspan dy="-1.9">​</tspan>   volume average</text><path d="M102.5,203 L102.5,211" fill="none" stroke="#0072B2" stroke-width="0.8" marker-end="url(#f1-scalar)"/><rect x="34" y="211" width="137" height="17" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="0.8"/><text x="40" y="222.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">ρ(T<tspan font-size="8" dy="1.9">avg</tspan><tspan dy="-1.9">​</tspan>)   resistivity</text><path d="M102.5,228 L102.5,236" fill="none" stroke="#0072B2" stroke-width="0.8" marker-end="url(#f1-scalar)"/><rect x="34" y="236" width="137" height="17" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="0.8"/><text x="40" y="247.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">R<tspan font-size="8" dy="1.9">bulk</tspan><tspan dy="-1.9">​</tspan> = ρ L / A</text><path d="M102.5,253 L102.5,261" fill="none" stroke="#0072B2" stroke-width="0.8" marker-end="url(#f1-scalar)"/><rect x="34" y="261" width="137" height="17" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="0.8"/><text x="40" y="272.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">R<tspan font-size="8" dy="1.9">total</tspan><tspan dy="-1.9">​</tspan> = R<tspan font-size="8" dy="1.9">bulk</tspan><tspan dy="-1.9">​</tspan> + 2R<tspan font-size="8" dy="1.9">c</tspan><tspan dy="-1.9">​</tspan></text><path d="M102.5,278 L102.5,286" fill="none" stroke="#0072B2" stroke-width="0.8" marker-end="url(#f1-scalar)"/><rect x="34" y="286" width="137" height="17" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="0.8"/><text x="40" y="297.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">I   set by R<tspan font-size="8" dy="1.9">total</tspan><tspan dy="-1.9">​</tspan></text><path d="M102.5,303 L102.5,311" fill="none" stroke="#0072B2" stroke-width="0.8" marker-end="url(#f1-scalar)"/><rect x="34" y="311" width="137" height="17" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="0.8"/><text x="40" y="322.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">P<tspan font-size="8" dy="1.9">bulk</tspan><tspan dy="-1.9">​</tspan> = I² R<tspan font-size="8" dy="1.9">bulk</tspan><tspan dy="-1.9">​</tspan></text><path d="M102.5,328 L102.5,336" fill="none" stroke="#6E6E6E" stroke-width="0.8" stroke-dasharray="2 2"/><rect x="34" y="336" width="137" height="17" rx="2" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.8" stroke-dasharray="2.5 2"/><text x="40" y="347.6" font-size="9" fill="#6E6E6E" text-anchor="start" font-weight="normal">P<tspan font-size="8" dy="1.9">contact</tspan><tspan dy="-1.9">​</tspan> = I² · 2R<tspan font-size="8" dy="1.9">c</tspan><tspan dy="-1.9">​</tspan></text><text x="34" y="363" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">reported, and not deposited</text><text x="34" y="373" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">anywhere in the thermal domain</text><text x="186" y="171" font-size="9.5" fill="#E69F00" text-anchor="start" font-weight="bold">Local electrical field</text><text x="186" y="181" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">returns a shape only</text><rect x="186" y="186" width="137" height="17" rx="2" fill="#FCF0DC" stroke="#E69F00" stroke-width="0.8"/><text x="192" y="197.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">T(r,z)   temperature field</text><path d="M254.5,203 L254.5,211" fill="none" stroke="#E69F00" stroke-width="0.8" marker-end="url(#f1-field)"/><rect x="186" y="211" width="137" height="17" rx="2" fill="#FCF0DC" stroke="#E69F00" stroke-width="0.8"/><text x="192" y="222.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">σ(T) = 1 / ρ(T)</text><path d="M254.5,228 L254.5,236" fill="none" stroke="#E69F00" stroke-width="0.8" marker-end="url(#f1-field)"/><rect x="186" y="236" width="137" height="17" rx="2" fill="#FCF0DC" stroke="#E69F00" stroke-width="0.8"/><text x="192" y="247.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">∇·(σ ∇V) = 0</text><path d="M254.5,253 L254.5,261" fill="none" stroke="#E69F00" stroke-width="0.8" marker-end="url(#f1-field)"/><rect x="186" y="261" width="137" height="17" rx="2" fill="#FCF0DC" stroke="#E69F00" stroke-width="0.8"/><text x="192" y="272.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">q‴<tspan font-size="8" dy="1.9">unit</tspan><tspan dy="-1.9">​</tspan>(r,z)</text><text x="338" y="171" font-size="9.5" fill="#D55E00" text-anchor="start" font-weight="bold">Thermal properties</text><text x="338" y="181" font-size="8" fill="#6E6E6E" text-anchor="start" font-weight="normal">returns matrix coefficients</text><rect x="338" y="186" width="137" height="17" rx="2" fill="#FBE9DF" stroke="#D55E00" stroke-width="0.8"/><text x="344" y="197.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">k(T)   conduction</text><path d="M406.5,203 L406.5,211" fill="none" stroke="#D55E00" stroke-width="0.8" marker-end="url(#f1-thermal)"/><rect x="338" y="211" width="137" height="17" rx="2" fill="#FBE9DF" stroke="#D55E00" stroke-width="0.8"/><text x="344" y="222.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">c<tspan font-size="8" dy="1.9">p</tspan><tspan dy="-1.9">​</tspan>(T)   transient only</text><path d="M406.5,228 L406.5,236" fill="none" stroke="#D55E00" stroke-width="0.8" marker-end="url(#f1-thermal)"/><rect x="338" y="236" width="137" height="17" rx="2" fill="#FBE9DF" stroke="#D55E00" stroke-width="0.8"/><text x="344" y="247.6" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">h<tspan font-size="8" dy="1.9">rad</tspan><tspan dy="-1.9">​</tspan>   radiation</text><text x="36" y="384" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">Each sweep re-evaluates all three branches from the temperature field the previous sweep produced.</text><path d="M252.5,392 L252.5,407" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#f1-grey)"/><rect x="127.5" y="408" width="250" height="28" rx="2" fill="#FBE9DF" stroke="#D55E00" stroke-width="1"/><text x="252.5" y="421" font-size="9.5" fill="#D55E00" text-anchor="middle" font-weight="bold">Assemble the thermal matrix</text><text x="252.5" y="432" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">one row per finite-volume cell</text><path d="M252.5,436 L252.5,449" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#f1-grey)"/><rect x="127.5" y="450" width="250" height="40" rx="2" fill="#FBE9DF" stroke="#D55E00" stroke-width="1"/><text x="252.5" y="463" font-size="9.5" fill="#D55E00" text-anchor="middle" font-weight="bold">Preconditioned linear solve</text><text x="252.5" y="474" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">PCG while the matrix is symmetric,</text><text x="252.5" y="484" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">BiCGSTAB once gas transport makes it not</text><path d="M252.5,490 L252.5,505" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#f1-grey)"/><rect x="127.5" y="506" width="250" height="28" rx="2" fill="#FBE9DF" stroke="#D55E00" stroke-width="1"/><text x="252.5" y="519" font-size="9.5" fill="#D55E00" text-anchor="middle" font-weight="bold">Relax the temperature field</text><text x="252.5" y="530" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">under-relaxed update</text><path d="M252.5,534 L252.5,547" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#f1-grey)"/><rect x="127.5" y="548" width="250" height="30" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1"/><text x="252.5" y="561" font-size="9.5" fill="#111111" text-anchor="middle" font-weight="bold">Convergence and energy closure</text><text x="252.5" y="572" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">field change, and the residual power balance</text><path d="M252.5,578 L252.5,593" fill="none" stroke="#6E6E6E" stroke-width="0.9" marker-end="url(#f1-grey)"/><rect x="127.5" y="594" width="250" height="28" rx="2" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="1"/><text x="252.5" y="607" font-size="9.5" fill="#6E6E6E" text-anchor="middle" font-weight="bold">Converged fields</text><text x="252.5" y="618" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">T(r,z), power distribution, loss channels</text><path d="M127.5,563 L14,563 L14,232 L25,232" fill="none" stroke="#111111" stroke-width="1" marker-end="url(#f1-ink)"/><text x="10" y="410" font-size="8.5" fill="#111111" text-anchor="middle" transform="rotate(-90 10 410)">not converged</text><text x="133.5" y="590" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">converged</text></svg>