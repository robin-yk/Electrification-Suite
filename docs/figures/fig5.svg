<svg xmlns="http://www.w3.org/2000/svg" width="505pt" height="318pt" viewBox="0 0 505 318" font-family="Arial, Helvetica, sans-serif"><rect width="505" height="318" fill="#FFFFFF"/><defs><marker id="f5-scalar" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#0072B2"/></marker><marker id="f5-field" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#E69F00"/></marker><marker id="f5-thermal" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#D55E00"/></marker><marker id="f5-gas" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#009E73"/></marker><marker id="f5-grey" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#6E6E6E"/></marker><marker id="f5-ink" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#111111"/></marker><marker id="f5-rule" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#BBBBBB"/></marker><marker id="f5-faint" viewBox="0 0 10 8" refX="9.4" refY="4" markerWidth="5" markerHeight="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#8A8A8A"/></marker></defs><text x="20" y="18" font-size="10" fill="#0072B2" text-anchor="start" font-weight="bold">Scalar branch</text><text x="96" y="18" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">sets how much power the element dissipates, from the volume-average temperature</text><rect x="20" y="26" width="108" height="28" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="1"/><text x="74" y="38" font-size="9.5" fill="#0072B2" text-anchor="middle" font-weight="bold">T<tspan font-size="8.5" dy="1.9">avg</tspan><tspan dy="-1.9">​</tspan></text><text x="74" y="49" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">volume average</text><path d="M128,40 L140,40" fill="none" stroke="#0072B2" stroke-width="1" marker-end="url(#f5-scalar)"/><rect x="142" y="26" width="108" height="28" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="1"/><text x="196" y="38" font-size="9.5" fill="#0072B2" text-anchor="middle" font-weight="bold">ρ(T<tspan font-size="8.5" dy="1.9">avg</tspan><tspan dy="-1.9">​</tspan>),  R<tspan font-size="8.5" dy="1.9">bulk</tspan><tspan dy="-1.9">​</tspan></text><text x="196" y="49" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">R<tspan font-size="8" dy="1.9">total</tspan><tspan dy="-1.9">​</tspan> = R<tspan font-size="8" dy="1.9">bulk</tspan><tspan dy="-1.9">​</tspan> + 2R<tspan font-size="8" dy="1.9">c</tspan><tspan dy="-1.9">​</tspan></text><path d="M250,40 L262,40" fill="none" stroke="#0072B2" stroke-width="1" marker-end="url(#f5-scalar)"/><rect x="264" y="26" width="108" height="28" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="1"/><text x="318" y="38" font-size="9.5" fill="#0072B2" text-anchor="middle" font-weight="bold">I</text><text x="318" y="49" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">set by R<tspan font-size="8" dy="1.9">total</tspan><tspan dy="-1.9">​</tspan></text><path d="M372,40 L384,40" fill="none" stroke="#0072B2" stroke-width="1" marker-end="url(#f5-scalar)"/><rect x="386" y="26" width="108" height="28" rx="2" fill="#E6F1F8" stroke="#0072B2" stroke-width="1"/><text x="440" y="38" font-size="9.5" fill="#0072B2" text-anchor="middle" font-weight="bold">P<tspan font-size="8.5" dy="1.9">bulk</tspan><tspan dy="-1.9">​</tspan> = I² R<tspan font-size="8.5" dy="1.9">bulk</tspan><tspan dy="-1.9">​</tspan></text><text x="440" y="49" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">one number, in watts</text><path d="M440,54 L440,62" fill="none" stroke="#6E6E6E" stroke-width="0.8" stroke-dasharray="2 2"/><rect x="236" y="62" width="258" height="18" rx="2" fill="#FFFFFF" stroke="#6E6E6E" stroke-width="0.8" stroke-dasharray="2.5 2"/><text x="365" y="74" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">P<tspan font-size="8" dy="1.9">contact</tspan><tspan dy="-1.9">​</tspan> = I² · 2R<tspan font-size="8" dy="1.9">c</tspan><tspan dy="-1.9">​</tspan>,  reported and not deposited</text><text x="20" y="106" font-size="10" fill="#E69F00" text-anchor="start" font-weight="bold">Field branch</text><text x="90" y="106" font-size="8.5" fill="#6E6E6E" text-anchor="start" font-weight="normal">sets only where that power lands, from the local temperature field</text><rect x="20" y="114" width="108" height="28" rx="2" fill="#FCF0DC" stroke="#E69F00" stroke-width="1"/><text x="74" y="126" font-size="9.5" fill="#E69F00" text-anchor="middle" font-weight="bold">T(r,z)</text><text x="74" y="137" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">temperature field</text><path d="M128,128 L140,128" fill="none" stroke="#E69F00" stroke-width="1" marker-end="url(#f5-field)"/><rect x="142" y="114" width="108" height="28" rx="2" fill="#FCF0DC" stroke="#E69F00" stroke-width="1"/><text x="196" y="126" font-size="9.5" fill="#E69F00" text-anchor="middle" font-weight="bold">σ(T) = 1 / ρ(T)</text><text x="196" y="137" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">local conductivity</text><path d="M250,128 L262,128" fill="none" stroke="#E69F00" stroke-width="1" marker-end="url(#f5-field)"/><rect x="264" y="114" width="108" height="28" rx="2" fill="#FCF0DC" stroke="#E69F00" stroke-width="1"/><text x="318" y="126" font-size="9.5" fill="#E69F00" text-anchor="middle" font-weight="bold">∇·(σ ∇V) = 0</text><text x="318" y="137" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">unit potential</text><path d="M372,128 L384,128" fill="none" stroke="#E69F00" stroke-width="1" marker-end="url(#f5-field)"/><rect x="386" y="114" width="108" height="28" rx="2" fill="#FCF0DC" stroke="#E69F00" stroke-width="1"/><text x="440" y="126" font-size="9.5" fill="#E69F00" text-anchor="middle" font-weight="bold">q‴<tspan font-size="8.5" dy="1.9">unit</tspan><tspan dy="-1.9">​</tspan>(r,z)</text><text x="440" y="137" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">a shape, not a magnitude</text><rect x="110" y="176" width="360" height="46" rx="2" fill="#FFFFFF" stroke="#111111" stroke-width="1.2"/><text x="290" y="194" font-size="10.5" fill="#111111" text-anchor="middle" font-weight="bold">q‴(r,z)  =  P<tspan font-size="9.5" dy="1.9">bulk</tspan><tspan dy="-1.9">​</tspan> · q‴<tspan font-size="9.5" dy="1.9">unit</tspan><tspan dy="-1.9">​</tspan>(r,z) / ∫ q‴<tspan font-size="9.5" dy="1.9">unit</tspan><tspan dy="-1.9">​</tspan> dV</text><text x="290" y="210" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">the shape is scaled so that its volume integral equals the scalar total</text><path d="M494,54 L500,54 L500,199 L472,199" fill="none" stroke="#0072B2" stroke-width="1" marker-end="url(#f5-scalar)"/><path d="M440,142 L440,174" fill="none" stroke="#E69F00" stroke-width="1" marker-end="url(#f5-field)"/><path d="M290,222 L290,238" fill="none" stroke="#111111" stroke-width="1" marker-end="url(#f5-ink)"/><rect x="170" y="240" width="240" height="30" rx="2" fill="#FBE9DF" stroke="#D55E00" stroke-width="1"/><text x="290" y="253" font-size="9.5" fill="#D55E00" text-anchor="middle" font-weight="bold">Assemble and solve the thermal system</text><text x="290" y="264" font-size="8.5" fill="#6E6E6E" text-anchor="middle" font-weight="normal">q‴ is the source term in every element cell</text><path d="M170,255 L10,255 L10,40 L18,40" fill="none" stroke="#D55E00" stroke-width="1" marker-end="url(#f5-thermal)"/><path d="M10,128 L18,128" fill="none" stroke="#D55E00" stroke-width="1" marker-end="url(#f5-thermal)"/><text x="6" y="180" font-size="8.5" fill="#D55E00" text-anchor="middle" transform="rotate(-90 6 180)">T(r,z)</text><path d="M20,288 L495,288" fill="none" stroke="#111111" stroke-width="0.9"/><text x="20" y="302" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">The field solve redistributes a fixed total power. It does not allow a local hot spot to increase the total</text><text x="20" y="314" font-size="9" fill="#111111" text-anchor="start" font-weight="normal">electrical power drawn.</text></svg>