name: Tests

on:
  push:
  pull_request:

jobs:
  solver-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run solver regression tests
        run: npm test
      - name: Build (verifies projectPages copy list is complete)
        run: npm run build
      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: npm run test:e2e
