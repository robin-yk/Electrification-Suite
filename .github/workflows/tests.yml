name: Tests

on:
  push:
  pull_request:

jobs:
  solver-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run solver regression tests
        run: node --test tests/joule-solver.test.js tests/microwave-solver.test.js
      - name: Build (verifies projectPages copy list is complete)
        run: |
          npm install
          npm run build
