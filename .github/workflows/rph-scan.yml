# Two dynamic-chemistry runs that need Cantera, which no development container
# here carries. They run on an Actions runner instead, on demand.
#
#   closure-diagnostic  Ten cases. The five-period pilot measured the dynamic
#                       answer departing from the quasi-steady blend by -28 % to
#                       +50 %, and at a 10 s period -- a hundred residence times,
#                       where quasi-steady is exact by construction -- the ratio
#                       is 0.724 rather than 1. Either that is physics or it is
#                       the reactor closure: constant pressure lets the gas
#                       expand when hot, cutting the residence time exactly when
#                       the chemistry runs. Running the same five periods under
#                       both closures settles it, and whichever way it lands the
#                       number belongs in the caveat rather than a shrug.
#
#   design-scan         The 4-D physical-drive Halton campaign, sharded.
#                       Its label is memory_gain = X_dyn / X_qs, so it trains a
#                       correction on top of the steady map rather than relearning
#                       the ignition cliff the steady map already has.
name: RPH dynamic scan

# Dispatching this by hand needs actions:write, which the automation token here
# does not carry, so a committed request file triggers it instead. Editing
# tools/openmkm_dynamic/scan-request.json starts a run and leaves a record in the
# history of what was asked for and why -- which a dispatch button does not.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "design-scan cases in total"
        default: "64"
      shards:
        description: "parallel shards for design-scan"
        default: "8"
      run_design:
        description: "run the design scan as well as the closure diagnostic"
        default: "true"
  push:
    paths:
      - "tools/openmkm_dynamic/scan-request.json"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.read.outputs.cases }}
      shards: ${{ steps.read.outputs.shards }}
      run_design: ${{ steps.read.outputs.run_design }}
      run_closure: ${{ steps.read.outputs.run_closure }}
      run_cjh_grid: ${{ steps.read.outputs.run_cjh_grid }}
      run_cjh_validate: ${{ steps.read.outputs.run_cjh_validate }}
      run_relabel: ${{ steps.read.outputs.run_relabel }}
      run_targets: ${{ steps.read.outputs.run_targets }}
      run_final_validation: ${{ steps.read.outputs.run_final_validation }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Settings from the dispatch inputs, else the request file
        run: |
          F=tools/openmkm_dynamic/scan-request.json
          # jq's // treats false as absent, so '.run_design // true' silently
          # flipped an explicit false back to true -- which is how a
          # validation-only request re-ran the full 448-index design scan.
          # has() asks the question actually meant: was the key set at all.
          flag() { jq -r "if has(\"$1\") then (.[\"$1\"]|tostring) else \"$2\" end" $F; }
          cases='${{ inputs.cases }}';        [ -n "$cases" ]      || cases=$(flag cases 64)
          shards='${{ inputs.shards }}';      [ -n "$shards" ]     || shards=$(flag shards 8)
          design='${{ inputs.run_design }}';  [ -n "$design" ]     || design=$(flag run_design false)
          closure=$(flag run_closure false)
          grid=$(flag run_cjh_grid false)
          validate=$(flag run_cjh_validate false)
          relabel=$(flag run_relabel false)
          targets=$(flag run_targets false)
          final_validation=$(flag run_final_validation false)
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "run_design=$design" >> "$GITHUB_OUTPUT"
          echo "run_closure=$closure" >> "$GITHUB_OUTPUT"
          echo "run_cjh_grid=$grid" >> "$GITHUB_OUTPUT"
          echo "run_cjh_validate=$validate" >> "$GITHUB_OUTPUT"
          echo "run_relabel=$relabel" >> "$GITHUB_OUTPUT"
          echo "run_targets=$targets" >> "$GITHUB_OUTPUT"
          echo "run_final_validation=$final_validation" >> "$GITHUB_OUTPUT"
          echo "cases=$cases shards=$shards run_design=$design run_closure=$closure run_cjh_grid=$grid"
          jq -r '.note // "(no note)"' $F

  closure-diagnostic:
    needs: plan
    if: ${{ needs.plan.outputs.run_closure == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/cantera/requirements.txt
      # run_cstr_pilot.py, not run_cstr_case.py: the pilot computes and stores
      # the quasi-steady reference beside each case, which the analysis needs and
      # the bare case runner does not emit. The first attempt used the case
      # runner, ran all ten Cantera integrations successfully, and then died in
      # the analysis on the missing key -- with the artifact upload skipped, so
      # four minutes of results were lost. Hence also if: always() below.
      - name: Five periods under each closure
        run: |
          mkdir -p out
          for closure in const-pressure const-volume; do
            echo "::group::$closure"
            python tools/openmkm_dynamic/run_cstr_pilot.py \
              --closure "$closure" --points-per-cycle 200 \
              --output "out/pilot-${closure}.jsonl"
            echo "::endgroup::"
          done
      - name: Does the correction go to one in the quasi-steady limit?
        run: |
          python - <<'PY'
          import json, pathlib
          rows = []
          for f in sorted(pathlib.Path("out").glob("pilot-*.jsonl")):
              for line in f.read_text().splitlines():
                  if not line.strip():
                      continue
                  d = json.loads(line)
                  closure = d["inputs"]["closure"]
                  c, q = d["cycle_summary"], d["quasi_steady_reference"]
                  rows.append((closure, d["inputs"]["period_s"],
                               c["mean_ch4_conversion"], q["ch4_conversion"],
                               c["mean_c2_selectivity_carbon"], q["c2_selectivity_carbon"],
                               c["converged"], c["cycles_to_convergence"]))
          print(f"{'closure':<16}{'period':>9}{'X_dyn':>10}{'X_qs':>10}{'ratio':>9}"
                f"{'S_dyn':>9}{'S_qs':>9}  conv")
          for closure, period, xd, xq, sd, sq, conv, ncyc in sorted(rows):
              r = xd / xq if xq > 1e-15 else float("nan")
              print(f"{closure:<16}{period:>9}{xd:>10.5f}{xq:>10.5f}{r:>9.3f}"
                    f"{sd:>9.4f}{sq:>9.4f}  {conv} ({ncyc}cyc)")
          print()
          print("The 10 s row is the test: quasi-steady is exact at a hundred")
          print("residence times, so its ratio must be 1. A closure that reaches")
          print("it and one that does not is the whole answer.")
          for closure in ("const-pressure", "const-volume"):
              long = [r for r in rows if r[0] == closure and r[1] == 10.0]
              if long:
                  r = long[0][2] / long[0][3]
                  print(f"  {closure:<16} ratio at 10 s = {r:.3f}"
                        f"   ({'reaches 1' if abs(r-1) < 0.05 else 'does NOT reach 1'})")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: closure-diagnostic
          path: out/

  # The dense steady map the RPH surrogate stands on. Sharded over tau
  # indices (i % shards), so every shard covers the full temperature range and
  # a lost shard costs tau columns, not a temperature band.
  cjh-grid:
    needs: plan
    if: ${{ needs.plan.outputs.run_cjh_grid == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/cantera/requirements.txt
      - name: Steady (T, tau) grid shard
        run: |
          mkdir -p out
          python tools/openmkm_dynamic/run_cjh_grid.py             --tau-points 25 --shard ${{ matrix.shard }} --shards 5             --output "out/cjh-grid-shard-${{ matrix.shard }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: cjh-grid-shard-${{ matrix.shard }}
          path: out/

  # 200 seeded points BETWEEN the grid nodes, each solved by the same steady
  # CSTR the grid used, against what interpolating the committed grid claims.
  # The surrogate reads its baseline off this map, so the map's interpolation
  # error is inherited by everything downstream; a grid is only ever checked at
  # its own nodes unless a job like this asks otherwise.
  cjh-validate:
    needs: plan
    if: ${{ needs.plan.outputs.run_cjh_validate == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/cantera/requirements.txt
      - name: Interpolation against fresh Cantera at 200 off-node points
        run: python tools/openmkm_dynamic/run_cjh_validate.py --points 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cjh-grid-validation
          path: tools/openmkm_dynamic/data/cjh-grid-validation.json

  # Relabels the historic 192 transient cases against the weighted baseline
  # without re-integrating any chemistry. The source is pinned to the commit
  # that first landed them, so this job's input cannot shift under it no matter
  # what later collect runs overwrite; fetch-depth 0 makes that commit
  # reachable. The artifact is named like a design shard so the collect job's
  # existing merge pattern picks it up as the design dataset.
  relabel:
    needs: plan
    if: ${{ needs.plan.outputs.run_relabel == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/cantera/requirements.txt
      - name: Recompute the baselines under the stored transients
        run: |
          git show 9a5c71f:tools/openmkm_dynamic/data/design-physical.jsonl > /tmp/historic-192.jsonl
          wc -l /tmp/historic-192.jsonl
          python tools/openmkm_dynamic/run_relabel.py --source /tmp/historic-192.jsonl \
            --output out/design-shard-relabel.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-shard-relabel
          path: out/

  # Second-round transient cases at explicit points, aimed by make_targets.py at
  # whatever region the surrogate's holdout verdict named. Same machinery, same
  # schema, same closure as the Halton campaign; only the sampling is aimed.
  targets:
    needs: plan
    if: ${{ needs.plan.outputs.run_targets == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/cantera/requirements.txt
      - name: Run the targeted cases
        run: |
          mkdir -p out
          python tools/openmkm_dynamic/run_cstr_design.py \
            --targets tools/openmkm_dynamic/data/targets-round2.json \
            --closure const-pressure --continue-on-error \
            --output out/design-shard-targets.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-shard-targets
          path: out/

  # Untouched final test. These points were frozen without transient outputs or
  # model residuals and are kept separate from canonical training data.
  final-validation:
    needs: plan
    if: ${{ needs.plan.outputs.run_final_validation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/cantera/requirements.txt
      - name: Run sealed final-test shard
        run: |
          mkdir -p out
          python tools/openmkm_dynamic/run_cstr_design.py \
            --targets tools/openmkm_dynamic/data/targets-final-validation.json \
            --target-shard ${{ matrix.shard }} --target-shards 8 \
            --closure const-pressure --continue-on-error \
            --output out/final-validation-shard-${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-validation-shard-${{ matrix.shard }}
          path: out/

  final-evaluate:
    needs: [plan, final-validation]
    if: ${{ always() && !cancelled() && needs.plan.outputs.run_final_validation == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: final-validation-shard-*
          path: gathered
      - name: Merge all 64 cases
        run: |
          mkdir -p out
          find gathered -name 'final-validation-shard-*.jsonl' -type f -print0 \
            | sort -z | xargs -0 cat > out/final-validation.jsonl
          test "$(wc -l < out/final-validation.jsonl)" -eq 64
      - name: Evaluate the frozen browser model
        run: |
          node tools/openmkm_dynamic/evaluate_final_validation.mjs \
            --data out/final-validation.jsonl \
            --output out/final-validation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-validation
          path: out/

  design-scan:
    needs: plan
    if: ${{ needs.plan.outputs.run_design == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/cantera/requirements.txt
      - name: Shard of the 4-D Halton design
        run: |
          TOTAL=${{ needs.plan.outputs.cases }}
          SHARDS=${{ needs.plan.outputs.shards }}
          PER=$(( (TOTAL + SHARDS - 1) / SHARDS ))
          START=$(( ${{ matrix.shard }} * PER + 1 ))
          if [ "$START" -gt "$TOTAL" ]; then echo "shard empty"; exit 0; fi
          if [ $(( START + PER - 1 )) -gt "$TOTAL" ]; then PER=$(( TOTAL - START + 1 )); fi
          echo "shard ${{ matrix.shard }}: cases $START..$(( START + PER - 1 ))"
          mkdir -p out
          python tools/openmkm_dynamic/run_cstr_design.py \
            --cases "$PER" --start "$START" --continue-on-error \
            --closure const-pressure \
            --output "out/design-shard-${{ matrix.shard }}.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: design-shard-${{ matrix.shard }}
          path: out/

  # The shards' outputs lived only as Actions artifacts, which expire after 90
  # days -- while this repository's convention is that computed datasets are
  # committed with a manifest (design-results-512, cantera.json, the pilot).
  # This job makes the campaign follow the convention: it gathers every shard,
  # merges them, writes a manifest with counts and the generating commit, and
  # pushes the result to main. contents: write is scoped to this job alone.
  collect:
    needs: [plan, closure-diagnostic, cjh-grid, design-scan, relabel, targets, final-evaluate]
    if: ${{ always() && !cancelled() && (needs.cjh-grid.result == 'success' || needs.design-scan.result == 'success' || needs.closure-diagnostic.result == 'success' || needs.relabel.result == 'success' || needs.targets.result == 'success' || needs.final-evaluate.result == 'success' || needs.final-evaluate.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: gathered
      - name: Merge shards into this run's own directory
        env:
          GENERATING_SHA: ${{ github.sha }}
        run: |
          python - <<'MERGE'
          import hashlib, json, os, pathlib, datetime
          root = pathlib.Path("gathered")
          sha = os.environ["GENERATING_SHA"][:7]
          # Each run owns runs/<commit>/ and nothing else. The previous layout
          # had every collect overwrite one set of shared filenames plus a
          # manifest describing only the latest run -- so main was always a
          # mid-state and the folder disagreed with its own manifest. Promotion
          # to canonical/ is a human act, via promote.py, after validation.
          out = pathlib.Path("tools/openmkm_dynamic/data/runs") / sha
          out.mkdir(parents=True, exist_ok=True)

          def merge(pattern, target):
              rows = []
              for f in sorted(root.glob(pattern)):
                  for line in f.read_text().splitlines():
                      if line.strip():
                          rows.append(line)
              if not rows:
                  return None
              text = "\n".join(rows) + "\n"
              (out / target).write_text(text)
              return {"file": target, "rows": len(rows),
                      "sha256": hashlib.sha256(text.encode()).hexdigest()}

          def copy_one(pattern, target):
              files = sorted(root.glob(pattern))
              if not files:
                  return None
              if len(files) != 1:
                  raise SystemExit(f"expected one {pattern}, found {len(files)}")
              data = files[0].read_bytes()
              (out / target).write_bytes(data)
              return {"file": target, "rows": 1,
                      "sha256": hashlib.sha256(data).hexdigest()}

          made = [m for m in (
              merge("cjh-grid-shard-*/**/cjh-grid-shard-*.jsonl", "cjh-grid.jsonl")
                  or merge("cjh-grid-shard-*/cjh-grid-shard-*.jsonl", "cjh-grid.jsonl"),
              merge("design-shard-*/**/design-shard-*.jsonl", "design-physical.jsonl")
                  or merge("design-shard-*/design-shard-*.jsonl", "design-physical.jsonl"),
              merge("closure-diagnostic/**/pilot-*.jsonl", "closure-diagnostic.jsonl")
                  or merge("closure-diagnostic/pilot-*.jsonl", "closure-diagnostic.jsonl"),
              merge("cjh-grid-validation/**/*.json", "cjh-grid-validation.json")
                  or merge("cjh-grid-validation/*.json", "cjh-grid-validation.json"),
              merge("final-validation/**/final-validation.jsonl", "final-validation.jsonl")
                  or merge("final-validation/final-validation.jsonl", "final-validation.jsonl"),
              copy_one("final-validation/**/final-validation-report.json",
                       "final-validation-report.json")
                  or copy_one("final-validation/final-validation-report.json",
                              "final-validation-report.json"),
          ) if m]
          if not made:
              raise SystemExit("no shard files found under gathered/")
          manifest = {
              "generated": datetime.date.today().isoformat(),
              "generating_commit": os.environ["GENERATING_SHA"],
              "workflow": "rph-scan.yml",
              "datasets": made,
              "status": "raw run output; promote to canonical/ with promote.py after validation",
          }
          (out / "manifest.json").write_text(json.dumps(manifest, indent=1) + "\n")
          print(json.dumps(manifest, indent=1))
          MERGE
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tools/openmkm_dynamic/data/runs/
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit \
            -m "Commit the scan campaign outputs the artifacts held" \
            -m "The CJH grid, the physical-drive design cases and the closure diagnostic existed only as workflow artifacts with a 90-day expiry, while this repository commits its computed datasets beside a manifest. Merged from the shards of the run recorded in campaign-manifest.json."
          for i in 1 2 3 4; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main || exit 1
            sleep $((2**i))
          done
          exit 1
