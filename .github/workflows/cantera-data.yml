name: Cantera data

on:
  push:
    paths:
      - "tools/cantera/**"
      - "apps/rphcjh/data/cantera.json"
      - ".github/workflows/cantera-data.yml"
  workflow_dispatch:

jobs:
  verify-precomputed-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Cantera
        run: pip install -r tools/cantera/requirements.txt
      - name: Verify committed JSON matches a fresh recompute
        run: python tools/cantera/precompute.py --check
